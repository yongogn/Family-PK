:root{
  --bg1:#1d1b4b;--bg2:#2d2a6e;--card:#ffffff;--ink:#22204a;--muted:#6b6993;
  --kid:#ff8a3d;--adult:#7b61ff;--gold:#ffc83d;--good:#22c55e;--bad:#ef4444;--grass:#7ad37a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);background:radial-gradient(1200px 600px at 50% -10%,#3b37a0 0%,var(--bg2) 40%,var(--bg1) 100%) fixed;touch-action:manipulation;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;touch-action:manipulation}
#app{max-width:820px;margin:0 auto;min-height:100vh;padding:16px 16px 90px}
.top{display:flex;align-items:center;gap:12px;color:#fff;margin-bottom:14px}
.top h1{font-size:22px;margin:0;flex:1;font-weight:700}
.back{background:rgba(255,255,255,.14);color:#fff;border-radius:14px;padding:8px 14px;font-size:16px;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);color:#fff;border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px}
.card{background:var(--card);border-radius:24px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.btn{background:var(--kid);color:#fff;font-weight:700;font-size:18px;padding:14px 22px;border-radius:18px;box-shadow:0 5px 0 #c9621f;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c9621f}
.btn.purple{background:var(--adult);box-shadow:0 5px 0 #4f37c9}
.btn.ghost{background:#eef0ff;color:var(--ink);box-shadow:0 5px 0 #c9cdf0}
.btn.gold{background:var(--gold);color:#5a3b00;box-shadow:0 5px 0 #c99a1d}
.btn.block{width:100%}
.muted{color:var(--muted)}
.center{text-align:center}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
/* avatar */
.av{position:relative;display:inline-grid;place-items:center;border-radius:50%;background:var(--c,#ff8a3d);box-shadow:inset 0 -6px 0 rgba(0,0,0,.15),0 4px 10px rgba(0,0,0,.2);flex:none}
.av .acc{position:absolute;top:-22%;right:-14%;transform:rotate(14deg)}
/* home */
.hero{color:#fff;text-align:center;padding:18px 0 8px}
.hero .logo{font-size:44px;font-weight:700;letter-spacing:.5px;line-height:1}
.hero .logo span{color:var(--gold)}
.hero p{margin:8px 0 0;opacity:.85}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:20px}
.pcard{cursor:pointer;background:#fff;border-radius:22px;padding:16px 10px;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.25);position:relative}
.pcard .nm{font-weight:700;font-size:19px;margin-top:10px}
.pcard .sub{font-size:13px;color:var(--muted);margin-top:2px}
.pcard .edit{position:absolute;top:8px;right:8px;background:#f1f2ff;border-radius:10px;padding:4px 8px;font-size:13px;color:var(--muted)}
.tag{display:inline-block;margin-top:8px;font-size:13px;font-weight:600;border-radius:999px;padding:3px 10px;background:#fff4e8;color:#c45a10}
.tag.ad{background:#efeaff;color:#5b43d6}
.pcard.add{display:grid;place-items:center;border:3px dashed rgba(255,255,255,.4);background:transparent;color:#fff;box-shadow:none;min-height:170px;font-size:18px;font-weight:600}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,8,40,.6);display:grid;place-items:center;z-index:50;padding:16px}
.modal .card{width:100%;max-width:520px;max-height:92vh;overflow:auto}
label.l{display:block;font-weight:600;margin:14px 0 6px}
input[type=text],input[type=number]{width:100%;font:inherit;font-size:18px;padding:12px 14px;border-radius:14px;border:2px solid #e2e3f5;outline:none}
input:focus{border-color:var(--adult)}
.seg{display:flex;background:#f1f2ff;border-radius:14px;padding:4px}
.seg button{flex:1;padding:10px;border-radius:11px;background:transparent;font-size:16px;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.1)}
.grid-pick{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.grid-pick button{font-size:30px;background:#f5f6ff;border-radius:14px;aspect-ratio:1;border:3px solid transparent;position:relative}
.grid-pick button.on{border-color:var(--adult);background:#efeaff}
.grid-pick button.locked{opacity:.4}
.grid-pick button .lk{position:absolute;bottom:2px;right:4px;font-size:12px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #e2e3f5}
.swatches button.on{box-shadow:0 0 0 3px var(--ink)}
/* map */
.stages{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.stage{flex:none;background:rgba(255,255,255,.12);color:#fff;border-radius:16px;padding:10px 14px;font-weight:600;font-size:15px;white-space:nowrap}
.stage.on{background:#fff;color:var(--ink)}
.stage.lock{opacity:.6}
.mapwrap{position:relative;border-radius:28px;overflow:hidden;background:linear-gradient(180deg,#8ad7ff 0%,#bdf0c4 30%,#86d88a 100%);box-shadow:0 10px 30px rgba(0,0,0,.3)}
.map{position:relative;height:620px}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.deco{position:absolute;font-size:30px;opacity:.9;pointer-events:none}
.node{position:absolute;transform:translate(-50%,-50%);text-align:center;width:120px}
.node .dot{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;font-size:36px;margin:0 auto;background:#fff;box-shadow:0 6px 0 rgba(0,0,0,.18),0 8px 18px rgba(0,0,0,.2);border:5px solid var(--kid);position:relative}
.node.done .dot{border-color:var(--good)}
.node.boss .dot{width:96px;height:96px;font-size:46px;border-color:var(--adult);background:#f3efff}
.node.locked .dot{opacity:.6;border-color:#9aa;background:#eef0f2}
.node .dot .lk{position:absolute;bottom:-6px;right:-6px;font-size:22px}
.node.next .dot{animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.node .lbl{margin-top:8px;background:rgba(255,255,255,.92);border-radius:12px;padding:4px 8px;font-weight:600;font-size:13px;display:inline-block}
.node .st{font-size:15px;letter-spacing:1px;margin-top:2px}
.mapfoot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:#fff;font-size:13px;opacity:.85}
.linkbtn{background:none;color:#fff;text-decoration:underline;font-size:13px;opacity:.8}
/* quiz */
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.prog{flex:1;height:14px;background:rgba(255,255,255,.18);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold);border-radius:999px;transition:width .3s}
.qcard{background:#fff;border-radius:28px;padding:28px 20px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.qlabel{font-size:14px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:1px}
.qtext{font-size:44px;font-weight:700;margin:14px 0 22px;white-space:pre-line;line-height:1.15}
.qtext.long{font-size:30px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{background:#f1f2ff;border-radius:20px;padding:20px 8px;font-size:30px;font-weight:700;color:var(--ink);box-shadow:0 5px 0 #d5d8f5;transition:transform .08s}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 #d5d8f5}
.opt.right{background:var(--good);color:#fff;box-shadow:0 5px 0 #15803d}
.opt.wrong{background:var(--bad);color:#fff;box-shadow:0 5px 0 #b91c1c}
.fb{min-height:30px;margin-top:16px;font-weight:600;font-size:18px}
.streak{color:#fff;font-weight:700;font-size:18px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* result */
.big{font-size:64px;font-weight:700;line-height:1}
.gauge{position:relative;height:90px;margin:24px 6px 8px}
.gauge .bar{position:absolute;left:0;right:0;top:44px;height:14px;border-radius:999px;background:linear-gradient(90deg,#c7d2fe,#a78bfa,#f472b6)}
.gauge .tick{position:absolute;top:62px;font-size:12px;color:var(--muted);transform:translateX(-50%)}
.gauge .mk{position:absolute;transform:translateX(-50%);text-align:center;font-weight:700;font-size:13px;white-space:nowrap}
.gauge .mk.up{top:0}
.gauge .mk.up::after{content:'';display:block;width:3px;height:16px;background:var(--ink);margin:2px auto 0}
.verdict{font-size:22px;font-weight:700;margin-top:10px}
.hist{display:flex;gap:6px;align-items:flex-end;height:80px;margin-top:10px;justify-content:center}
.hist div{width:28px;background:var(--adult);border-radius:8px 8px 4px 4px;position:relative}
.hist div span{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted)}
.stars3{font-size:56px;letter-spacing:6px}
.stars3 .off{filter:grayscale(1);opacity:.3}
.small{font-size:12px}
/* boss */
.arena{position:fixed;inset:0;display:grid;grid-template-rows:1fr auto 1fr;background:var(--bg1);z-index:40}
.half{display:flex;flex-direction:column;justify-content:center;padding:14px;gap:12px}
.half.adult{background:linear-gradient(180deg,#3b2f8f,#2a2470)}
.half.kid{background:linear-gradient(0deg,#9a4a17,#5a2e18)}
.half.flip{transform:rotate(180deg)}
.half .who{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:18px}
.half .who .sc{margin-left:auto;font-size:14px;opacity:.85}
.half .bq{background:#fff;border-radius:20px;text-align:center;font-size:34px;font-weight:700;padding:14px;white-space:pre-line}
.half .bq.long{font-size:24px}
.half .opts .opt{padding:14px 6px;font-size:26px}
.half.locked .opts{opacity:.4;pointer-events:none}
.mid{background:#14123a;padding:10px 14px;color:#fff;display:flex;align-items:center;gap:12px}
.rope{flex:1;position:relative;height:22px;border-radius:999px;background:linear-gradient(90deg,var(--adult) 0 50%,var(--kid) 50% 100%);overflow:visible}
.rope .knot{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:30px;transition:left .25s}
.timer{font-weight:700;font-size:20px;width:46px;text-align:center}
.bossexit{background:rgba(255,255,255,.15);color:#fff;border-radius:10px;padding:6px 10px;font-size:13px}
/* trophy */
.trophy{font-size:120px;animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(0) rotate(-30deg)}100%{transform:scale(1) rotate(0)}}
.confetti{position:fixed;top:-20px;width:10px;height:16px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.badge{background:#fff;border-radius:20px;padding:14px 8px;text-align:center}
.badge .e{font-size:40px}
.badge .n{font-weight:700;margin-top:4px}
.badge .d{font-size:12px;color:var(--muted);margin-top:2px}
.badge.off{opacity:.45}
.badge.off .e{opacity:.5}
.trow{display:flex;align-items:center;gap:12px;background:#fffbea;border-radius:16px;padding:12px;margin-top:10px}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:#fff;border-radius:20px;padding:12px 18px;box-shadow:0 10px 30px rgba(0,0,0,.35);display:flex;gap:12px;align-items:center;z-index:70;animation:tin .4s}
.toast .e{font-size:36px}
@keyframes tin{from{transform:translate(-50%,-40px);opacity:0}}
h2{margin:0 0 10px}
.sect{color:#fff;font-weight:700;font-size:18px;margin:22px 0 10px}
@media (max-width:480px){.qtext{font-size:36px}.opt{font-size:26px}.hero .logo{font-size:36px}.half .bq{font-size:26px}.half .opts .opt{font-size:22px;padding:10px 4px}}

/* v2 additions */
.qtext.txt{font-size:26px;line-height:1.3}
.qvis{font-size:96px;line-height:1;margin:6px 0 10px}
.passage{background:#fff8e6;border-left:6px solid var(--gold);border-radius:14px;padding:12px 14px;text-align:left;font-size:18px;line-height:1.45;margin:10px 0 4px;color:#3b3560}
.opts.one{grid-template-columns:1fr}
.opts.one .opt,.opts.two .opt{font-size:20px;padding:16px 10px;line-height:1.25}
.pad{position:relative;margin:4px 0 16px;border-radius:18px;overflow:hidden;border:3px solid #dfe3ff;
  background-color:#fff;background-image:linear-gradient(#eef1ff 1px,transparent 1px),linear-gradient(90deg,#eef1ff 1px,transparent 1px);background-size:24px 24px}
.pad canvas{display:block;width:100%;height:clamp(220px,34vh,320px);touch-action:none;cursor:crosshair}
@media (min-width:700px){.pad canvas{height:max(360px,44vh)}}
.pad.big canvas{height:68vh}
.pad .padbar{position:absolute;top:8px;right:8px;display:flex;gap:6px}
.pad .padbar button{background:rgba(255,255,255,.95);border:2px solid #e2e3f5;border-radius:12px;padding:6px 10px;font-size:15px;font-weight:600;color:var(--ink)}
.pad .padhint{position:absolute;left:12px;top:10px;font-size:13px;color:#a3a6c9;pointer-events:none}
.padtoggle{background:rgba(255,255,255,.16);color:#fff;border-radius:14px;padding:8px 12px;font-weight:600;font-size:15px;white-space:nowrap}
.padtoggle.on{background:#fff;color:var(--ink)}
.half .pad{margin:0;flex:1;min-height:80px;display:flex}
.half .pad canvas{height:auto;flex:1;min-height:80px}
.half .bq.txt{font-size:20px}
.half .bq .qvis{font-size:56px;margin:0}
.half .opts.one .opt,.half .opts.two .opt{font-size:16px;padding:10px 6px}
.half .padtoggle{background:rgba(255,255,255,.2);padding:4px 10px;font-size:14px}
.subjrow{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.subjrow span{font-size:12px;background:#f3f4ff;border-radius:999px;padding:3px 8px;font-weight:600;color:#4a4778}
.agebars{display:grid;gap:10px;margin-top:6px}
.agebar{display:grid;grid-template-columns:130px 1fr 52px;align-items:center;gap:10px;font-weight:600;font-size:15px}
.agebar .tr{height:14px;background:#eef0ff;border-radius:999px;position:relative;overflow:visible}
.agebar .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
.agebar .tr b{position:absolute;top:-4px;width:3px;height:22px;background:var(--ink);border-radius:2px}
@media (max-width:480px){.qtext.txt{font-size:22px}.qvis{font-size:76px}.agebar{grid-template-columns:96px 1fr 44px;font-size:13px}}

.qvis.many{font-size:40px;letter-spacing:2px;line-height:1.3}
.listen{background:#efeaff;color:var(--ink);border-radius:16px;padding:10px 18px;font-size:18px;font-weight:700;margin:4px 0 14px}
.opts.zh .opt{font-size:34px}
.explain{background:#f3f6ff;border-radius:14px;padding:12px 14px;margin-top:10px;text-align:left;font-size:17px;line-height:1.45;font-weight:500}
.verdict-line{font-size:19px}
.fb{min-height:0}
.review{margin-top:18px;text-align:left;background:#f8f8ff;border-radius:16px;padding:10px 14px}
.review summary{font-weight:700;cursor:pointer;padding:4px 0}
.rv{border-top:1px solid #e6e7f7;padding:10px 0;font-size:15px;line-height:1.4}
.rv.no .rq{color:#b91c1c}
.rq{font-weight:600;margin-bottom:2px}
.pad .padexp{display:inline-block}
/* iPad landscape: question & answers on the left, big working paper on the right */
@media (min-width:900px) and (orientation:landscape){
  #app{max-width:1180px}
  .qcard.haspad{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);grid-template-areas:"q pad" "opts pad" "fb pad";column-gap:22px;align-items:start}
  .qcard.haspad .qhead{grid-area:q}.qcard.haspad .pad{grid-area:pad;margin:0}.qcard.haspad .opts{grid-area:opts}.qcard.haspad .fb{grid-area:fb}
  .qcard.haspad .pad canvas{height:calc(100vh - 150px)}
  .qcard.haspad .pad .padexp{display:none}
}

.arena.remote{grid-template-rows:auto auto 1fr}
.arena.guest{grid-template-rows:1fr auto auto}
.rpanel{padding:14px;background:linear-gradient(180deg,#3b2f8f,#2a2470);color:#fff}
.rpanel.kidp{background:linear-gradient(0deg,#9a4a17,#5a2e18)}
.rpanel .who{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.rpanel .who .sc{margin-left:auto;font-size:14px;opacity:.85}
.roomcode{display:flex;gap:10px;justify-content:center;margin-top:14px}
.roomcode span{width:62px;height:76px;border-radius:16px;background:#1d1b4b;color:var(--gold);font-size:44px;font-weight:700;display:grid;place-items:center;box-shadow:0 5px 0 #0e0c30}
.countdown{position:fixed;inset:0;display:grid;place-items:center;font-size:160px;font-weight:700;color:#fff;background:rgba(10,8,40,.55);z-index:80;text-shadow:0 8px 30px rgba(0,0,0,.4);pointer-events:none}
.waitdots{color:var(--muted);font-weight:600}
.waitdots span{animation:blink 1.4s infinite}.waitdots span:nth-child(2){animation-delay:.2s}.waitdots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
.orline{text-align:center;color:var(--muted);margin:14px 0 10px;font-weight:600}

#app{position:relative;z-index:1}

.btn{border-radius:20px;letter-spacing:.3px;transition:transform .08s,filter .15s}

.avedit{display:flex;align-items:center;gap:14px;background:#f6f4ff;border-radius:22px;padding:10px 14px;cursor:pointer}

.avtabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}

.swatch{width:54px;height:54px;border-radius:50%;display:block;border:4px solid #fff;box-shadow:0 0 0 2px #ddd}
/* home */

.logosub{color:#fff;opacity:.9;font-weight:600;margin-top:2px}

.pcard{border-radius:26px;border:4px solid #fff;box-shadow:0 8px 0 rgba(0,0,0,.15),0 12px 24px rgba(0,0,0,.25);background:linear-gradient(180deg,color-mix(in srgb,var(--c,#fff) 22%,#fff) 0%,#fff 55%);transition:transform .15s}

.pcard .nm{font-size:22px}
.kpis{display:flex;justify-content:center;gap:8px;margin-top:6px;font-weight:700;font-size:14px}
.playbtn{margin-top:12px;padding:12px;font-size:19px}
.homefoot{margin-top:22px;color:#fff;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.homefoot>div{flex-basis:100%}
.homefoot a{color:#fff}
.sect{font-size:20px;text-shadow:0 2px 0 rgba(0,0,0,.25)}

.stage.on{border-color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.stage.arcade{background:linear-gradient(135deg,#f472b6,#a855f7);border-color:#fbcfe8}
.stage.arcade.lock{background:rgba(255,255,255,.12)}
.mapwrap{background:#fff7d6;border:5px solid #fff}
.map{position:relative}
.band{position:absolute;left:0;right:0}
.chhead{position:absolute;left:50%;transform:translateX(-50%);background:#fff;border-radius:18px;padding:6px 18px;font-weight:700;font-size:17px;box-shadow:0 5px 0 rgba(0,0,0,.15);white-space:nowrap;z-index:2}

.map svg .dash{animation:march 1.2s linear infinite}

.node.done .dot{border-color:#22c55e;background:#f0fdf4}
.node.next .dot{box-shadow:0 0 0 8px rgba(250,204,21,.55),0 7px 0 rgba(0,0,0,.2)}
.node .won{position:absolute;top:-12px;right:-12px;font-size:26px}
.node .lbl.play{background:var(--kid);color:#fff;margin-top:4px}
.deco{font-size:28px;z-index:1}
/* boss */
.bosshero{display:flex;align-items:center;justify-content:center;gap:16px;margin:6px 0 10px}
.bosshero>span{font-size:34px}
.opplist{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.opp{background:#f6f6ff;border:3px solid transparent;border-radius:20px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:15px}
.opp.on{border-color:var(--adult);background:#efeaff}
.opp.add{border:3px dashed #d4d4f7;color:var(--muted)}
.rec{font-size:12px;font-weight:700;background:#fff;border-radius:999px;padding:2px 8px;color:#4c1d95}
.rec.new{color:#16a34a}
.streakline{font-size:18px;font-weight:700;color:#ea580c;margin:4px 0}
/* arcade */
.arcadehead{padding:14px 18px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:14px}
.gcard{background:#fff;border-radius:26px;padding:16px;border:4px solid #fff;box-shadow:0 8px 0 rgba(0,0,0,.15);text-align:center}
.gcard.locked{opacity:.6;filter:saturate(.4)}
.gicon{font-size:56px}
.gname{font-weight:700;font-size:20px;margin:2px 0 4px}
.needs{margin-top:10px;font-weight:600;color:var(--muted);font-size:14px}
.gshell{position:fixed;inset:0;z-index:45;display:flex;flex-direction:column;background:linear-gradient(180deg,#312e81,#1e1b4b)}
.gbar{display:flex;align-items:center;gap:12px;padding:10px 14px;color:#fff;font-size:20px}
.gbar b{flex:1}
#gscore{background:#facc15;color:#713f12;border-radius:999px;padding:4px 14px;font-weight:700}
.garea{flex:1;position:relative;touch-action:none}
.garea canvas{position:absolute;inset:0;touch-action:none}
.gctl{display:flex;gap:10px;padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
.gctl button{flex:1;background:#fff;border-radius:18px;font-size:28px;font-weight:700;padding:14px 0;box-shadow:0 5px 0 #c7c9f5}
.gctl button:active{transform:translateY(3px);box-shadow:0 2px 0 #c7c9f5}
.pturn{flex:1;color:#fff;text-align:center;font-size:20px;display:flex;align-items:center;justify-content:center;gap:8px}
.gover{position:absolute;inset:0;background:rgba(10,8,40,.6);display:grid;place-items:center;padding:20px}
.gover .card{max-width:380px;width:100%}
/* speaking */
.speakcard h2{font-size:26px}
.sayword{font-size:64px;font-weight:700;margin:8px 0;line-height:1.1}
.sayword.zh{font-size:96px}
.btn.mic{background:linear-gradient(180deg,#f43f5e,#e11d48);box-shadow:0 5px 0 #9f1239;font-size:20px}
.btn.mic.listening{animation:pulse 1s infinite;background:#22c55e;box-shadow:0 5px 0 #15803d}
@media (max-width:480px){.hero .logo{font-size:40px}.bubble{font-size:13px;max-width:190px}.players{grid-template-columns:repeat(2,1fr)}.sayword{font-size:48px}.sayword.zh{font-size:76px}}
</style>

<script>
/* ===== QUESTION BANKS =====
   Format: year|question|answer|wrong1|wrong2|wrong3|passage (may be empty)|explanation
   Year = UK school year (1–6). 7 = secondary / grown-up Boss level only (never shown to children). */
const BANK_LANG=`
1|Which word rhymes with "cat"?|hat|cup|dog|sun||Cat and hat both end in the "at" sound.
1|Which word rhymes with "bee"?|tree|bed|cow|pin||Bee and tree both end in the "ee" sound.
1|Which word starts with "sh"?|ship|chip|slip|tip||Ship begins with the sh sound. Chip starts with ch.
1|Which word is a colour?|green|grass|jump|happy||Green is a colour. Grass is green, but grass is a thing.
1|What goes at the end of a telling sentence?|a full stop|a comma|a capital letter|a space||A telling sentence ends with a full stop. Questions end with a question mark.
1|Which word means more than one dog?|dogs|doges|dog|dogies||Add -s to make most words mean more than one: dog → dogs.
1|The cat sat on the ___.|mat|sing|blue|ran||"The cat sat on the mat" makes sense — a mat is a thing you can sit on.
1|Which word has the "ee" sound?|green|grin|gran|grown||Green has "ee" in the middle: gr-ee-n.
1|Which one is a day of the week?|Monday|March|Morning|Mango||Monday is a day. March is a month.
1|Which letter is a capital?|G|g|q|j||G is the capital (big) letter. g, q and j are small letters.
1|What colour is the ball?|red|blue|green|yellow|Sam has a red ball. He kicks it to his dog, Max.|The story says "Sam has a red ball".
1|Who is Max?|a dog|a boy|a cat|a ball|Sam has a red ball. He kicks it to his dog, Max.|"He kicks it to his dog, Max" — so Max is the dog.
2|More than one box is…|boxes|boxs|boxies|box||Words ending in x add -es: box → boxes.
2|More than one baby is…|babies|babys|babyes|babis||Consonant + y: change y to i and add -es: baby → babies.
2|Today I run. Yesterday I…|ran|runned|runs|running||Run is irregular: today I run, yesterday I ran.
2|Today I go. Yesterday I…|went|goed|gone|going||Go is irregular: yesterday I went.
2|Listen and pick the correct spelling.|because|becuase|becos|beacause||It's spelt b-e-c-a-u-s-e. Trick: "Big Elephants Can Always Understand Small Elephants".
2|Listen and pick the correct spelling.|people|peeple|pepole|peopel||It's spelt p-e-o-p-l-e — the "eo" is the tricky part.
2|What is the opposite of "hot"?|cold|warm|sunny|fire||Hot ↔ cold. Warm is only a little bit hot.
2|What is the opposite of "happy"?|sad|glad|funny|kind||Happy ↔ sad. Glad means almost the same as happy.
2|Which word is a verb (doing word)?|jump|table|blue|soft||You can do it: I jump. Table is a thing; blue and soft describe things.
2|Which sentence is a question?|Where is my hat?|My hat is red.|Put on your hat.|What a lovely hat!||A question asks something and ends with "?".
2|I was hungry ___ I ate an apple.|so|but|or|if||"So" shows a result: I was hungry, so I ate.
2|care + ful =|careful|carefull|carful|careing||The suffix -ful has only one l: careful.
2|How often did Mia water the seed?|every day|once a week|never|every two weeks|Mia planted a seed in a pot. She watered it every day. After two weeks, a tiny green shoot appeared.|The story says "She watered it every day".
2|What appeared after two weeks?|a green shoot|a flower|an apple|a bug|Mia planted a seed in a pot. She watered it every day. After two weeks, a tiny green shoot appeared.|"After two weeks, a tiny green shoot appeared."
3|More than one leaf is…|leaves|leafs|leafes|leavs||Many words ending in -f change to -ves: leaf → leaves.
3|More than one child is…|children|childs|childrens|childes||Child is irregular: one child, two children.
3|Yesterday I ___ the ball. (catch)|caught|catched|cought|catches||Catch is irregular: catch → caught.
3|Yesterday she ___ a letter. (write)|wrote|writed|written|writes||Write → wrote (past). "Written" needs a helper: she has written.
3|Listen and pick the correct spelling.|friend|freind|frend|freand||"i before e": f-r-i-e-n-d. Trick: a friend to the end.
3|Which word means the same as "big"?|large|tiny|thin|quick||Big and large are synonyms (same meaning).
3|Which prefix makes "happy" mean the opposite?|un|dis|re|pre||Un + happy = unhappy (not happy).
3|Which word is an adjective (describing word)?|fluffy|run|quickly|table||Fluffy describes a noun: a fluffy cat.
3|Which word sounds the same as "sea"?|see|say|sigh|saw||Sea and see are homophones — same sound, different meaning.
3|___ dog is very fluffy.|Their|There|They're|Thier||"Their" means belonging to them. There = a place; they're = they are.
3|Which words need capital letters? "we visited paris in may."|we, paris, may|visited, in|paris only|in, may||The first word of a sentence, names of places (Paris) and months (May) need capitals.
3|What was the fox probably doing?|hunting|sleeping|playing|swimming|The fox crept silently through the long grass. Its ears twitched as it listened for the rustle of a mouse.|It was creeping quietly and listening for a mouse — it was hunting.
3|Which word tells us the fox moved quietly?|silently|long|twitched|listened|The fox crept silently through the long grass. Its ears twitched as it listened for the rustle of a mouse.|Silently means without making a sound.
4|More than one tooth is…|teeth|tooths|teeths|toothes||Tooth is irregular: one tooth, many teeth.
4|More than one mouse is…|mice|mouses|meese|mices||Mouse is irregular: one mouse, two mice.
4|Yesterday we ___ some sweets. (buy)|bought|buyed|brought|buy||Buy → bought. Brought is the past of bring.
4|I ___ my homework yesterday. (bring)|brought|bringed|brang|bought||Bring → brought. Bought is the past of buy.
4|Listen and pick the correct spelling.|believe|beleive|belive|beleave||b-e-l-i-e-v-e. Trick: never believe a lie — "lie" is inside believe.
4|Which word is an adverb?|quickly|quick|quiet|quilt||Adverbs often end in -ly and describe how: run quickly.
4|One dog owns a bone. Which is correct?|the dog's bone|the dogs bone|the dog,s bone|the dogs's bone||For one owner, add apostrophe + s: the dog's bone.
4|Which word means the same as "brave"?|courageous|scared|careful|lazy||Courageous means brave. Scared is the opposite.
4|Which word is a conjunction?|because|beautiful|below|bounce||Conjunctions join clauses: I stayed in because it rained.
4|Which uses inverted commas correctly?|"Come here," said Mum.|Come here, "said Mum."|"Come here, said Mum."|Come "here," said Mum.||Only the spoken words go inside the inverted commas, with the comma inside too.
4|Which sentence starts with a fronted adverbial?|After lunch, we played chess.|We played chess after lunch.|We played chess.|Chess is fun.||A fronted adverbial (when/where/how) comes first, followed by a comma.
4|How did Leo feel?|comfortable|frightened|angry|bored|Despite the rain hammering on the roof, Leo felt cosy wrapped in his blanket, a mug of cocoa warming his hands.|"Cosy", a blanket and warm cocoa all tell us he felt comfortable.
4|"Hammering" suggests the rain was…|heavy and loud|light and gentle|stopping|warm|Despite the rain hammering on the roof, Leo felt cosy wrapped in his blanket, a mug of cocoa warming his hands.|A hammer makes hard, loud bangs — so the rain was heavy and noisy.
5|Listen and pick the correct spelling.|necessary|neccessary|necesary|neccesary||One c, two s: "one collar, two sleeves" — necessary.
5|Listen and pick the correct spelling.|rhythm|rythm|rhythym|rhytm||r-h-y-t-h-m. Trick: Rhythm Helps Your Two Hips Move.
5|Which word is a modal verb?|might|mighty|mind|most||Modal verbs show possibility: might, could, should, will, must.
5|Past tense of "seek"|sought|seeked|sook|soughted||Seek → sought (like think → thought).
5|Past tense of "forgive"|forgave|forgived|forgaved|forgot||Forgive → forgave (like give → gave).
5|The girl ___ won the race is my sister.|who|which|what|where||Use "who" for people. "Which" is for things.
5|What is the opposite of "generous"?|selfish|kind|rich|giving||Generous means happy to share; selfish means not wanting to share.
5|Which word has a silent letter?|knee|need|nest|neat||The k in knee is silent — you say "nee".
5|Which punctuation can show parenthesis?|brackets|a full stop|a question mark|an apostrophe||Brackets (or dashes/commas) add extra information: My aunt (a pilot) visited.
5|Which is a metaphor?|The classroom was a zoo.|The classroom was like a zoo.|The classroom was noisy.|We went to the zoo.||A metaphor says something IS something else. "Like" would make it a simile.
5|Why did something feel wrong?|The gulls were silent|It was raining|He was tired|The light broke|The old lighthouse keeper squinted at the horizon. For forty years he had watched these waters, and tonight something felt wrong — the gulls had fallen silent.|The dash explains it: "the gulls had fallen silent".
5|"Squinted" means he…|narrowed his eyes|shouted|closed the door|smiled|The old lighthouse keeper squinted at the horizon. For forty years he had watched these waters, and tonight something felt wrong — the gulls had fallen silent.|To squint is to half-close your eyes to see far away.
6|Listen and pick the correct spelling.|accommodate|accomodate|acommodate|accommadate||Double c AND double m: accommodate — it has room for both.
6|Listen and pick the correct spelling.|conscience|concience|consience|conscence||con + science = conscience.
6|Which sentence is in the passive voice?|The window was broken by Tom.|Tom broke the window.|Tom is breaking it.|Did Tom break it?||Passive: the thing affected comes first, then "was ... by".
6|Which uses a semi-colon correctly?|It was late; we went home.|It was; late we went home.|It was late we; went home.|It; was late we went home.||A semi-colon joins two complete, related sentences.
6|Which word means the same as "meticulous"?|careful|messy|quick|lucky||Meticulous means very careful and precise.
6|What is the opposite of "transparent"?|opaque|clear|shiny|thin||Transparent lets light through; opaque blocks it.
6|Which sentence uses the subjunctive?|If I were you, I would rest.|If I am you, I rest.|I was you yesterday.|You was right.||The subjunctive uses "were" for imaginary situations: If I were you…
6|What does "reluctant" mean?|unwilling|excited|early|proud||Reluctant = not wanting to do something.
6|Which is the most formal?|We regret to inform you…|Sorry to tell you…|Bad news, mate…|Oops, so…||Formal writing avoids chatty words like "mate" and "oops".
6|Which is personification?|The wind howled angrily.|The wind was strong.|It was windy.|Wind is moving air.||Personification gives human actions or feelings to non-human things — wind can't really be angry.
6|What did Priya think of her design?|It was just okay|It was brilliant|It was broken|She hadn't seen it|Although the committee praised her design, Priya couldn't shake the feeling that it was merely adequate — functional, yes, but hardly inspired.|"Merely adequate… hardly inspired" means she thought it was only okay.
6|"Merely adequate" means…|only good enough|excellent|terrible|very old|Although the committee praised her design, Priya couldn't shake the feeling that it was merely adequate — functional, yes, but hardly inspired.|Adequate = good enough; merely = only.
7|Which word is spelt correctly?|millennium|millenium|milennium|millennuim||Double l, double n: mille (thousand) + annum (year).
7|Which word is spelt correctly?|minuscule|miniscule|minuskule|minnuscule||From Latin minus — so minuscule, not "mini".
7|Which word is spelt correctly?|liaise|liase|laise|liaese||l-i-a-i-s-e: two i's.
7|Plural of "criterion"|criteria|criterions|criterias|criterion's||Greek origin: one criterion, two criteria.
7|What does "ubiquitous" mean?|found everywhere|very rare|extremely old|hard to see||Ubiquitous = seeming to be everywhere at once.
7|What does "sanguine" mean?|optimistic|furious|exhausted|secretive||Sanguine = cheerfully hopeful.
7|What does "obfuscate" mean?|make unclear|explain clearly|destroy|celebrate||To obfuscate is to deliberately make something confusing.
7|Between you and ___.|me|I|myself|mine||After a preposition (between) use the object pronoun: me.
7|"Peter Piper picked a peck" is an example of…|alliteration|onomatopoeia|hyperbole|oxymoron||Alliteration repeats the starting sound (p-p-p).
7|"Deafening silence" is an example of…|an oxymoron|a simile|alliteration|a pun||An oxymoron puts opposite ideas together.
7|Which word is a palindrome?|level|lever|label|novel||Level reads the same backwards.
7|Past tense of "forsake"|forsook|forsaked|forsank|forsooked||Forsake → forsook → forsaken (like take → took → taken).
7|Which uses "affect" correctly?|The cold can affect your mood.|The affect was huge.|It had a big affect.|Affect was felt by all.||Affect is usually the verb; effect is usually the noun.
7|"Kowtow" entered English from which language?|Chinese|Japanese|Hindi|Malay||From Chinese 叩头 (kòutóu), to bow until your head touches the ground.
7|"Equivocation" means…|deliberately vague language|clear honesty|angry shouting|fast talking|The minister's statement was a masterclass in equivocation: every sentence could be read as both a promise and a denial.|Equivocation = using ambiguous words to avoid committing.
7|What does "pusillanimous" mean?|cowardly|enormous|cheerful|stubborn||Pusillanimous = lacking courage.
`;
const BANK_GEO=`
1|Which is a hot, dry place?|a desert|the North Pole|Antarctica|a glacier||Deserts get very little rain and are often hot.
1|What do you find at the seaside?|sand and waves|snow and ice|skyscrapers|volcanoes||The seaside is where land meets the sea — sand and waves.
1|A model of Earth shaped like a ball is a…|globe|compass|ruler|clock||A globe is a round model of the Earth.
1|Which season is coldest in the UK?|winter|summer|spring|autumn||Winter is the coldest season in the UK.
1|Which is a type of weather?|rain|rock|road|river||Rain falls from clouds — it's weather.
1|Which is a city?|London|England|Europe|Atlantic||London is a city. England is a country, Europe a continent, Atlantic an ocean.
1|Which animal lives in a hot, sandy desert?|camel|penguin|polar bear|seal||Camels store fat in their humps and can go days without water.
2|How many continents are there?|7|5|6|9||Asia, Africa, North America, South America, Antarctica, Europe and Australia (Oceania).
2|Which is the biggest ocean?|Pacific|Atlantic|Indian|Arctic||The Pacific is the largest and deepest ocean.
2|Which continent is Singapore in?|Asia|Europe|Africa|Australia||Singapore is in South-East Asia.
2|Which country is just north of Singapore?|Malaysia|Indonesia|Thailand|Japan||The Causeway links Singapore to Johor in Malaysia.
2|On a compass, the opposite of North is…|South|East|West|Up||North ↔ South, East ↔ West.
2|Which animal lives in Antarctica?|penguin|camel|tiger|kangaroo||Penguins live in Antarctica's icy seas.
2|England, Scotland, Wales and ___ make the UK.|Northern Ireland|France|Iceland|Norway||The UK = England, Scotland, Wales and Northern Ireland.
3|Which river flows through London?|Thames|Seine|Nile|Danube||The Thames. The Seine flows through Paris.

const parse=t=>t.trim().split('\n').map(l=>l.trim()).filter(Boolean).map(l=>l.split('|'));
const BANK={lang:parse(BANK_LANG),geo:parse(BANK_GEO),sci:parse(BANK_SCI),zh:parse(BANK_ZH)};
const CAPS=parse(CAPITALS).map(f=>({y:+f[0],c:f[1],cap:f[2],trap:f[3]}));
const FLG=parse(FLAGS).map(f=>({y:+f[0],f:f[1],n:f[2],trap:f[3]||''}));

function fromEntry(f){
  const q={q:f[1],ans:f[2],opts:shuffle([f[2],f[3],f[4],f[5]]),passage:f[6]||'',e:f[7]||'',key:f[1]+(f[6]||'')+f[2]};
  if(/^Listen/.test(q.q)){if(SPEECH.ok)q.say={t:q.ans,l:'en'};else q.q='Which word is spelt correctly?'}
  return q;
}
function distract(pool,correct,field,n=3,trap){
  const d=[];if(trap)d.push(trap);
  for(const x of shuffle(pool)){const v=x[field];if(d.length>=n)break;if(v!==correct&&!d.includes(v))d.push(v)}
  return d.slice(0,n);
}
function genCapital(y){
  const c=pick(CAPS.filter(x=>x.y===y));
  const d=distract(CAPS.filter(x=>Math.abs(x.y-y)<=1),c.cap,'cap',3,c.trap);
  return{q:`What is the capital of ${c.c}?`,ans:c.cap,opts:shuffle([c.cap,...d]),key:'cap'+c.c,
    e:`The capital of ${c.c} is ${c.cap}.${c.trap?` ${c.trap} is a well-known city there, but it isn't the capital.`:''}`};
}
function genFlag(y){
  const c=pick(FLG.filter(x=>x.y===y));
  const d=distract(FLG.filter(x=>Math.abs(x.y-y)<=2),c.n,'n',3,c.trap);
  return{q:'Which country has this flag?',vis:c.f,ans:c.n,opts:shuffle([c.n,...d]),key:'flag'+c.n,

function genZhWord(y){
  let pool=ZHW.filter(x=>x.y===y);if(!pool.length)pool=ZHW.filter(x=>Math.abs(x.y-y)<=1);
  const w=pick(pool);let near=ZHW.filter(x=>Math.abs(x.y-y)<=1&&x.w!==w.w);const same=ZHW.filter(x=>Math.abs(x.y-y)<=2&&x.w!==w.w&&x.w.length===w.w.length);if(same.length>=3)near=same;
  const e=`${w.w} (${w.py}) means "${w.m}".`;
  const types=['mean','char'];if(w.em&&y<=4)types.push('pic','pic');if(SPEECH.zh&&y<=4)types.push('listen','listen');if(y>=2)types.push('pinyin');
  const t=pick(types);
  if(t==='mean')return{q:`What does ${w.w} mean?`,ans:w.m,opts:shuffle([w.m,...distract(near,w.m,'m')]),key:'zm'+w.w,e};
  if(t==='char')return{q:`Which word means "${w.m}"?`,ans:w.w,opts:shuffle([w.w,...distract(near,w.w,'w')]),key:'zc'+w.w,e,zhOpts:1};
  if(t==='pic')return{q:'Which word matches the picture?',vis:w.em,ans:w.w,opts:shuffle([w.w,...distract(near.filter(x=>x.em),w.w,'w')]),key:'zp'+w.w,e,zhOpts:1};
  if(t==='listen')return{q:'Listen 🔊 Which word did you hear?',ans:w.w,opts:shuffle([w.w,...distract(near,w.w,'w')]),key:'zl'+w.w,e,say:{t:w.w,l:'zh'},zhOpts:1};

}
function genBank(sid,level,seen){
  const y=clamp(Math.round(level),1,7);
  let tries=0,q;
  do{
    const entries=BANK[sid].filter(f=>+f[0]===y);
    const r=Math.random();
    if(sid==='geo'&&y>=2&&r<.25)q=genCapital(y);
    else if(sid==='geo'&&r<.45)q=genFlag(y);
    else if(sid==='zh'&&r<.6)q=genZhWord(y);
    else q=fromEntry(pick(entries.length?entries:BANK[sid].filter(f=>Math.abs(+f[0]-y)<=1)));
    tries++;
  }while(seen&&seen.has(q.key)&&tries<14);
  return q;
}
function genQ(sid,level,seen){
  let q,t=0;
  if(sid==='maths'){do{q=genMaths(level);t++}while(seen&&seen.has(q.key)&&t<6)}
  else q=genBank(sid,level,seen);
  if(seen)seen.add(q.key);
  const L=Math.max(...q.opts.map(o=>o.length));
  q.layout=q.big?'':(L>16?'one':L>7?'two':'');
  return q;

    /* Chinese stage: speak only the Chinese words/characters */
    const zh=[];const grab=t=>{const m=String(t||'').match(/[\u3400-\u9fff][\u3400-\u9fff\uff0c\u3002\uff1f\uff01\u3001]*/g);if(m)m.forEach(x=>zh.push({t:x,l:'zh'}))};
    if(q.say)zh.push({t:q.say.t,l:'zh'});else{grab(q.passage);grab(q.q);if(withOpts&&!q.zhOpts)q.opts.forEach(grab);else if(withOpts)q.opts.forEach(o=>zh.push({t:o,l:'zh'}))}
    if(listen)return speakParts([{t:q.say.t,l:'zh'}]);
    return speakParts(zh);
  }
  const parts=[];
  if(q.passage)parts.push({t:q.passage});
  parts.push({t:q.q});
  if(q.say)parts.push({t:q.say.t,l:q.say.l});
  if(withOpts&&!listen){parts.push({t:'Is it'});q.opts.forEach((o,i)=>{if(i===q.opts.length-1)parts.push({t:'or'});parts.push({t:o,l:/[\u3400-\u9fff]/.test(o)?'zh':'en'})})}
  speakParts(parts);
}

function seasonFor(d){

  if(m===10||(m===11&&day<=15))return 'spooky';
  if(m===11)return 'autumn';
  if(m===12)return 'winter';
  if((m===1&&day>=15)||m===2)return 'lny';
  if(m===1)return 'winter';

let PADBIG=false;
function padHTML(id,hint=true,expand=true){return `<div class="pad ${PADBIG&&expand?'big':''}" id="${id}-wrap"><canvas id="${id}"></canvas>${hint?'<span class="padhint">✏️ Working paper — write here</span>':''}<div class="padbar">${expand?`<button class="padexp" onclick="PADBIG=!PADBIG;renderQ()">${PADBIG?'⤡ Smaller':'⤢ Bigger'}</button>`:''}<button onclick="padClear('${id}')">🧽 Clear</button></div></div>`}
function padInit(id,onFirst){
  const c=document.getElementById(id);if(!c)return;
  const r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  c.width=Math.max(1,r.width*dpr);c.height=Math.max(1,r.height*dpr);
  const x=c.getContext('2d');x.scale(dpr,dpr);x.lineCap='round';x.lineJoin='round';x.strokeStyle='#2b2870';x.fillStyle='#2b2870';
  let drawing=false,lx=0,ly=0,rect=r,used=false;
  const pos=e=>({x:e.clientX-rect.left,y:e.clientY-rect.top});
  c.onpointerdown=e=>{e.preventDefault();rect=c.getBoundingClientRect();drawing=true;try{c.setPointerCapture(e.pointerId)}catch(_){}
    const p=pos(e);lx=p.x;ly=p.y;x.beginPath();x.arc(lx,ly,1.6,0,7);x.fill();
    const h=c.parentNode.querySelector('.padhint');if(h)h.remove();
    if(!used){used=true;onFirst&&onFirst()}};
  c.onpointermove=e=>{if(!drawing)return;e.preventDefault();const p=pos(e);
    x.lineWidth=e.pointerType==='pen'&&e.pressure>0?1.5+e.pressure*3.5:3;
    x.beginPath();x.moveTo(lx,ly);x.lineTo(p.x,p.y);x.stroke();lx=p.x;ly=p.y};
  c.onpointerup=c.onpointercancel=()=>{drawing=false};
}
function padClear(id){const c=document.getElementById(id);if(c)c.getContext('2d').clearRect(0,0,c.width,c.height)}

     seen:new Set(),pad:STAGE==='maths'?padDefault(p):false,read:readDefault(p),token:0};

/* question difficulty: tests warm up easy then climb; practice levels ramp from easier to harder within the level */
function qLevel(){
  const p=cur(),mx=kidMax(p);
  if(Q.mode==='test')return clamp(Q.level,1,mx);
  const ramp=-0.6+1.0*(Q.i/(Q.n-1));
  return clamp(Q.ability+lvlOff(Q.ch,Q.lv)+ramp,1,mx);
}
function nextQ(){
  if(Q.i>=Q.n)return Q.mode==='test'?finishTest():finishLevel();
  if(Q.mode==='level'&&Q.i===4&&!Q.spoke&&canSpeak(Q.sid,cur())){Q.spoke=true;return speakRound(()=>nextQ())}
  Q.cur=genQ(Q.sid,qLevel(),Q.seen);Q.t0=Date.now();Q.locked=false;Q.padUsed=false;Q.token++;
  renderQ();
  const c=Q.cur;
  if(Q.read)setTimeout(()=>readQ(c,true,Q.sid),250);else if(c.say)setTimeout(()=>speakParts([c.say]),250);
}
function togglePad(){Q.pad=!Q.pad;const p=cur();p.padOn=Q.pad;save();renderQ()}
function renderQ(){

  app().innerHTML=`<div class="qtop"><button class="back" onclick="try{speechSynthesis.cancel()}catch(e){};map()">✕</button>
    <div class="prog"><i style="width:${Q.i/Q.n*100}%"></i></div>

    <button class="padtoggle ${Q.pad?'on':''}" onclick="togglePad()">✏️ ${Q.pad?'Hide paper':'Paper'}</button></div>
   <div class="qcard ${Q.pad?'haspad':''}" id="qc">
    <div class="qhead"><div class="qlabel">${node[0]} ${node[1]} · ${Q.i+1}/${Q.n}</div>
    ${c.passage?`<div class="passage">${esc(c.passage)}</div>`:''}

    ${c.say?`<button class="listen" onclick="speakParts([Q.cur.say])">🔊 ${listen?'Play again':'Hear it'}</button>`:''}</div>
    ${Q.pad?padHTML('qpad'):''}
    <div class="opts ${c.layout} ${c.zhOpts?'zh':''}">${c.opts.map((o,k)=>`<button class="opt" data-k="${k}" onclick="answer(${k},this)">${esc(o)}</button>`).join('')}</div>
    <div class="fb" id="fb"></div></div>`;
  if(Q.pad)padInit('qpad',()=>{if(!Q.padUsed){Q.padUsed=true;const p=cur();p.stats.padQs++;save();checkStatBadges(p)}});
  if(Q.locked)showFeedback();
}
function answer(k,el){
  if(Q.locked)return;Q.locked=true;
  const p=cur(),c=Q.cur,ok=c.opts[k]===c.ans,t=(Date.now()-Q.t0)/1000;
  Q.times.push(t);p.stats.answered++;Q.lastOk=ok;Q.picked=c.opts[k];
  Q.log.push({q:c.q,passage:c.passage,vis:c.vis,ans:c.ans,picked:c.opts[k],ok,e:c.e});
  if(ok){Q.correct++;Q.streak++;p.stats.correct++;sGood();
    if(Q.streak>p.stats.bestStreak)p.stats.bestStreak=Q.streak;
    if(Q.streak>=5)award(p,'streak5');if(Q.streak>=10)award(p,'streak10');
  }else{Q.streak=0;$('#qc').classList.add('shake');sBad()}
  if(Q.mode==='test'){
    /* warm-up: first 2 questions never move the level. Then climb 0.5 per right answer until the first miss,
       after that 2-in-a-row to go up, 1 miss to go down (keeps success around 70%). */
    if(Q.i>=2){
      if(ok){if(!Q.missed)Q.level+=0.5;else if(++Q.run>=2){Q.level+=0.5;Q.run=0}}
      else{Q.missed=true;Q.run=0;Q.level-=0.5}
      Q.level=clamp(Q.level,1,kidMax(p));
    }
    Q.trail.push(Q.level);
  }else Q.ability=clamp(Q.ability+(ok?.04:-.04),0.5,kidMax(p));
  Q.i++;save();
  showFeedback();
  const tok=Q.token;
  if(ok)setTimeout(()=>{if(Q&&Q.token===tok&&Q.locked)nextQ()},c.big?2200:2800);
}
function showFeedback(){
  const c=Q.cur,ok=Q.lastOk;
  document.querySelectorAll('.opt').forEach(b=>{const v=c.opts[+b.dataset.k];if(v===c.ans)b.classList.add('right');else if(v===Q.picked)b.classList.add('wrong')});
  $('#fb').innerHTML=`<div class="verdict-line" style="color:${ok?'var(--good)':'var(--bad)'}">${ok?pick(['Brilliant! ✨','Correct! 🎉','Super! 💪','Nailed it! 🌟']):`Not quite — the answer is <b>${esc(c.ans)}</b>`}</div>
    ${c.e?`<div class="explain"><b>Why?</b> ${esc(c.e)}</div>`:''}
    <button class="btn ${ok?'ghost':''} block" style="margin-top:12px" onclick="Q.token++;nextQ()">${Q.i>=Q.n?'See results':'Next'} ▶</button>`;

}

function finishTest(){
  const p=cur(),s=sub(p,Q.sid),last=Q.trail.slice(-6);

function finishLevel(){
  const p=cur(),s=sub(p,Q.sid),i=Q.ch*NLV+Q.lv,node=stageById(Q.sid).chapters[Q.ch].levels[Q.lv];

/* Robo-Boss: answers on a timer; Fierce is faster and more accurate */
function roboTick(){
  if(!B||B.over||!B.robo)return;
  const fierce=bossOpts.strength==='fierce',wait=(fierce?3000:4300)+Math.random()*(fierce?1400:2000),acc=fierce?0.82:0.65;

function bossAns(side,k,el){
  if(!B||B.over)return;const s=B.sides[side];if(s.lock)return;
  const ok=s.q.opts[k]===s.q.ans;
  if(ok){el.classList.add('right');sGood();if(side==='kid'){B.p++;B.ks++;B.kLvl=Math.min(B.kLvl+0.2,B.kCap)}else{B.p--;B.as++}moveKnot();
    if(Math.abs(B.p)>=LIMIT)return endBoss(B.p>0?'kid':'adult');
    setTimeout(()=>B&&!B.over&&newBossQ(side),250);
  }else{el.classList.add('wrong');sBad();s.lock=true;
    const freeze=side==='adult'&&bossOpts.strength==='gentle'?2500:1300;
    setTimeout(()=>{if(!B||B.over)return;drawSide(side);setTimeout(()=>{if(B&&!B.over)newBossQ(side)},freeze)},350);}

function rmRematch(){if(RM.conn&&RM.conn.open&&RM.guest)startRemoteBoss();else remoteHost()}
function stopBoss(){if(B){clearInterval(B.timer);clearTimeout(B.roboT)}}
function ordinal(n){const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function endBoss(result){
  if(!B||B.over)return;B.over=true;clearInterval(B.timer);clearTimeout(B.roboT);
  const {kid,ad,sid,ch}=B,st=stageById(sid),bn=st.chapters[ch].boss;setLayer('');
  if(B.remote){if(result===null){rmSend({t:'cancel'});rmClose()}else rmSend({t:'end',result,ks:B.ks,as:B.as})}
  if(result===null){B=null;return bossSetup()}
  const rematch=B.remote?`rmRematch()`:`bossSetup()`,rlabel=`↻ Rematch ${esc(ad.name)}`;
  const r=rivalRec(kid,ad);r.name=ad.name;r.last=today();
  if(result==='kid'){r.w++;r.streak=r.streak>0?r.streak+1:1}else if(result==='adult'){r.l++;r.streak=r.streak<0?r.streak-1:-1}else{r.d++;r.streak=0}
  if(ad.boss&&ad.id!=='remote'&&ad.id!=='robo'){if(result==='kid')ad.boss.l++;else if(result==='adult')ad.boss.w++;else ad.boss.d++}
  const recLine=`Record vs ${esc(ad.name)}: <b>${r.w}W · ${r.l}L${r.d?' · '+r.d+'D':''}</b>`;
  if(result==='kid'){
    const firstTrophy=kid.trophies.length===0,newChapter=!bossWon(kid,sid,ch);
    kid.trophies.push({sid,ch,stage:st.name,boss:bn[1],d:today(),vs:ad.name,robo:!!B.robo,remote:!!B.remote,strength:bossOpts.strength});
    kid.tokens=(kid.tokens||0)+3;
    save();if(!B.robo)award(kid,'boss');checkStatBadges(kid);sWin();confetti(150);
    const head=r.w===1?`First win against ${esc(ad.name)}! 🎉`:`You beat ${esc(ad.name)} again — that's your ${ordinal(r.w)} win!`;
    const streak=r.streak>=2?`<div class="streakline">🔥 ${r.streak} wins in a row against ${esc(ad.name)}!</div>`:'';
    app().innerHTML=`<div class="card center pop" style="margin-top:30px">
      <div class="trophy">🏆</div><h2 style="font-size:28px">${esc(kid.name)} WINS!</h2>
      <p style="font-size:18px">${head}</p>${streak}
      <div class="bosshero">${avatar(kid,90,true)}<span>⚔️</span><div style="opacity:.6">${avatar(ad,64)}</div></div>
      <p class="muted">Score ${B.ks} – ${B.as} · ${recLine}<br>🏆 ${bn[1]} trophy · +3 🪙${newChapter&&ch<NCH-1?` · <b>Chapter ${ch+2} unlocked!</b>`:''}${firstTrophy?' · 👑 Crown unlocked for your avatar!':''}</p>
      <div class="row"><button class="btn ghost" style="flex:1" onclick="${rematch}">${rlabel}</button><button class="btn gold" style="flex:1" onclick="cabinet()">🏆 Cabinet</button></div>
      <button class="btn block" style="margin-top:12px" onclick="map()">Map 🗺️</button></div>`;
  }else{
    save();
    const lossHead=result==='adult'?(r.streak<=-2?`${esc(ad.name)} has won ${-r.streak} in a row — time for revenge!`:`${esc(ad.name)} defends the ${esc(bn[1])}!`):"It's a draw!";
    app().innerHTML=`<div class="card center pop" style="margin-top:30px">
      <div style="font-size:90px">${result==='adult'?(B.robo?'🤖':'🐲'):'🤝'}</div>
      <h2>${lossHead}</h2>
      <p class="muted">Score ${B.ks} – ${B.as} · ${recLine}<br>${result==='adult'?'Train on the levels to grow stronger, then come back!':'So close! One more round?'}</p>
      <div class="row"><button class="btn" style="flex:1" onclick="${rematch}">${rlabel}</button><button class="btn ghost" style="flex:1" onclick="map()">Map</button></div></div>`;
  }
  B=null;
}

    const h=body[0];x.fillStyle='#fff';x.beginPath();x.arc(ox+h[0]*cs+cs/2+dir[0]*3-dir[1]*5,oy+h[1]*cs+cs/2+dir[1]*3-dir[0]*5,3.5,0,7);x.arc(ox+h[0]*cs+cs/2+dir[0]*3+dir[1]*5,oy+h[1]*cs+cs/2+dir[1]*3+dir[0]*5,3.5,0,7);x.fill();

/* ---- Candy Stack (falling blocks, original piece set on an 8×14 board) ---- */
function gStack(){
  const g=shell('stack','🍬 Candy Stack',`<button onpointerdown="GAME.mv(-1)">◀</button><button onpointerdown="GAME.rot()">⟳</button><button onpointerdown="GAME.mv(1)">▶</button><button onpointerdown="GAME.drop()">⤓</button>`);

  const hit=(cells,px,py)=>cells.some(([a,b])=>{const X=a+px,Y=b+py;return X<0||X>=W||Y>=H||(Y>=0&&grid[Y][X])});
  const lock=()=>{pc.c.forEach(([a,b])=>{if(pc.y+b>=0)grid[pc.y+b][pc.x+a]=pc.col});let cl=0;

function gPenguinMenu(){

  setLayer(`<div class="modal"><div class="card center pop"><div style="font-size:70px">🐧</div><h2>Penguin Pop</h2>

   <button class="btn block" onclick="gPenguin('robo')">🤖 ${esc(p.name)} vs Robo</button>
   <button class="btn purple block" style="margin-top:10px" onclick="gPenguin('two')">👫 2 players (pass the iPad)</button>

function gPenguin(mode){
  const p=cur(),g=shell('penguin','🐧 Penguin Pop','<div id="pturn" class="pturn"></div>');
  const N=7,C=3,cs=Math.floor(Math.min(g.W,g.H-10)/N),ox=(g.W-cs*N)/2,oy=(g.H-cs*N)/2;
  const ice=Array.from({length:N},()=>Array(N).fill(true));
  const names=[p.name,mode==='robo'?'Robo':'Player 2'];let turn=0,falling=[];
  const supported=g2=>{const seen=Array.from({length:N},()=>Array(N).fill(false)),q=[];
    for(let i=0;i<N;i++)for(let j=0;j<N;j++)if((i===0||j===0||i===N-1||j===N-1)&&g2[j][i]){seen[j][i]=true;q.push([i,j])}
    while(q.length){const [i,j]=q.pop();for(const [a,b] of[[1,0],[-1,0],[0,1],[0,-1]]){const X=i+a,Y=j+b;if(X>=0&&Y>=0&&X<N&&Y<N&&g2[Y][X]&&!seen[Y][X]){seen[Y][X]=true;q.push([X,Y])}}}
    return seen};
  const apply=(g2,i,j)=>{g2[j][i]=false;const s=supported(g2),fell=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(g2[y][x]&&!s[y][x]){g2[y][x]=false;fell.push([x,y])}return fell};
  const showTurn=()=>{const e=$('#pturn');if(e)e.innerHTML=`${turn===0?avMini(p,30):(mode==='robo'?avMini(ROBO,30):'👤')} <b>${esc(names[turn])}</b>'s turn`};
  const move=(i,j)=>{if(g.over||!ice[j][i]||(i===C&&j===C))return false;
    const fell=apply(ice,i,j);falling.push({x:i,y:j,t:performance.now()},...fell.map(f=>({x:f[0],y:f[1],t:performance.now()})));beep(400,.06);
    setScore(g.score+(turn===0?1:0));
    if(!ice[C][C]){setTimeout(()=>{const winner=names[1-turn];if(turn===0)setScore(0);gameOver(turn===0?`${winner} wins! 🐧💦`:`${p.name} wins! 🎉`)},700);return true}
    turn=1-turn;showTurn();if(mode==='robo'&&turn===1)g.to=setTimeout(roboMove,700);return true};
  const roboMove=()=>{if(g.over)return;const opts=[];for(let j=0;j<N;j++)for(let i=0;i<N;i++)if(ice[j][i]&&!(i===C&&j===C)){const t=ice.map(r=>r.slice());apply(t,i,j);opts.push({i,j,safe:t[C][C]})}
    const safe=opts.filter(o=>o.safe);const m=pick(safe.length?safe:opts);move(m.i,m.j)};
  g.c.addEventListener('pointerdown',e=>{if(mode==='robo'&&turn===1)return;const r=g.c.getBoundingClientRect(),i=Math.floor((e.clientX-r.left-ox)/cs),j=Math.floor((e.clientY-r.top-oy)/cs);if(i>=0&&j>=0&&i<N&&j<N)move(i,j)});
  showTurn();
  const draw=t=>{if(g.dead)return;const x=g.x;x.clearRect(0,0,g.W,g.H);
    x.fillStyle='#0c4a6e';x.fillRect(ox-8,oy-8,cs*N+16,cs*N+16);
    for(let j=0;j<N;j++)for(let i=0;i<N;i++)if(ice[j][i]){x.fillStyle=(i===C&&j===C)?'#e0f2fe':'#bae6fd';x.fillRect(ox+i*cs+2,oy+j*cs+2,cs-4,cs-4);x.fillStyle='rgba(255,255,255,.6)';x.fillRect(ox+i*cs+6,oy+j*cs+6,cs*.3,cs*.12)}
    falling=falling.filter(f=>t-f.t<600);falling.forEach(f=>{const k=(t-f.t)/600;x.globalAlpha=1-k;x.fillStyle='#7dd3fc';const s=(cs-4)*(1-k*.6);x.fillRect(ox+f.x*cs+cs/2-s/2,oy+f.y*cs+cs/2-s/2+k*20,s,s);x.globalAlpha=1});
    if(ice[C][C]||g.over)emo(x,ice[C][C]?'🐧':'💦',ox+C*cs+cs/2,oy+C*cs+cs/2,cs*.8);
    g.raf=requestAnimationFrame(draw)};g.raf=requestAnimationFrame(draw);
}

/* ============ SPEAKING PRACTICE (child speaks; speech recognition) ============ */
const SRC=window.SpeechRecognition||window.webkitSpeechRecognition;
const SAY_EN={1:'cat,dog,sun,fish,frog,tree,red,big,hat,cup',2:'rabbit,garden,yellow,people,because,flower,water,happy,school,family',
 3:'friend,island,castle,dinosaur,library,beautiful,mountain,elephant,garden,picture',4:'believe,favourite,adventure,dangerous,interesting,February,question,surprise,dictionary,breakfast',
 5:'necessary,rhythm,environment,temperature,vegetable,comfortable,mysterious,disappear,knowledge,government',6:'accommodate,conscience,embarrass,parliament,pronunciation,miscellaneous,sincerely,thorough,rhyme,muscle'};
function canSpeak(sid,p){return !!SRC&&p.speak!==false&&(sid==='zh'||sid==='lang')}
function speakTarget(sid,level){
  const y=clamp(Math.round(level),1,6);
  if(sid==='zh'){const pool=ZHW.filter(w=>w.y<=Math.max(1,Math.min(4,y))&&w.y>=Math.max(1,y-2));const w=pick(pool.length?pool:ZHW.filter(w=>w.y<=2));return{t:w.w,show:w.w,sub:`${w.py} · ${w.m}`,vis:w.em,lang:'zh-CN',prompt:'Say it in Chinese!'}}
  const words=SAY_EN[y].split(',');const w=pick(words);return{t:w.toLowerCase(),show:w,sub:'',vis:'',lang:'en-GB',prompt:'Read this word out loud!'}
}
function speakRound(after){
  const p=cur(),T=speakTarget(Q.sid,Q.ability);Q.sp={T,tries:0,after};
  app().innerHTML=`<div class="qtop"><button class="back" onclick="try{SR&&SR.abort()}catch(e){};map()">✕</button><div class="prog"><i style="width:${Q.i/Q.n*100}%"></i></div><span class="chip">🎤 Bonus</span></div>
   <div class="qcard speakcard"><div class="qlabel">🎤 Speaking bonus · +1 🪙</div>
    <h2 style="margin:6px 0">${T.prompt}</h2>
    ${T.vis?`<div class="qvis">${T.vis}</div>`:''}
    <div class="sayword ${T.lang==='zh-CN'?'zh':''}">${esc(T.show)}</div>${T.sub?`<div class="muted" style="font-size:20px">${esc(T.sub)}</div>`:''}
    <div class="row" style="justify-content:center;gap:10px;margin-top:16px">
      ${SPEECH.ok&&(T.lang!=='zh-CN'||SPEECH.zh)?`<button class="btn ghost" onclick="speakParts([{t:Q.sp.T.t,l:Q.sp.T.lang==='zh-CN'?'zh':'en'}])">🔊 Hear it</button>`:''}
      <button class="btn mic" id="micbtn" onclick="listen()">🎤 Tap & say it</button></div>
    <div id="srout" class="fb"></div></div>`;
}
let SR=null;
function listen(){
  const T=Q.sp.T,out=$('#srout'),btn=$('#micbtn');
  try{speechSynthesis.cancel()}catch(e){}
  try{SR=new SRC();SR.lang=T.lang;SR.interimResults=false;SR.maxAlternatives=5;SR.continuous=false}catch(e){return speakFail('Speaking isn\'t available on this device.')}
  btn.classList.add('listening');btn.textContent='👂 Listening…';out.innerHTML='';
  let got=false;
  SR.onresult=e=>{got=true;const alts=[];for(const r of e.results)for(const a of r)alts.push(a.transcript.trim());
    const norm=s=>s.toLowerCase().replace(/[\s.,!?。，！？]/g,'');
    const ok=alts.some(a=>norm(a).includes(norm(T.t))||(T.lang==='zh-CN'&&T.t.length===1&&norm(a)===norm(T.t)));
    speakResult(ok,alts[0]||'')};
  SR.onerror=e=>{btn.classList.remove('listening');btn.textContent='🎤 Tap & say it';
    if(e.error==='not-allowed'||e.error==='service-not-allowed')speakFail('Microphone permission is off. A grown-up can allow it in Settings → Safari → Microphone.');
    else if(e.error==='no-speech')out.innerHTML='<span class="muted">I didn\'t hear anything — tap and try again, a bit louder!</span>';
    else out.innerHTML=`<span class="muted">Couldn't listen (${esc(e.error)}). Try again.</span>`};
  SR.onend=()=>{btn.classList.remove('listening');btn.textContent='🎤 Tap & say it';if(!got&&!out.innerHTML)out.innerHTML='<span class="muted">Tap and say it again.</span>'};
  try{SR.start()}catch(e){speakFail('Couldn\'t start the microphone.')}
}
function speakResult(ok,heard){
  const p=cur(),out=$('#srout');Q.sp.tries++;
  if(ok){sGood();confetti(30);p.tokens=(p.tokens||0)+1;p.stats.spoken=(p.stats.spoken||0)+1;save();if(p.stats.spoken>=10)award(p,'speaker');
    out.innerHTML=`<div class="verdict-line" style="color:var(--good)">🌟 Perfect! I heard “${esc(heard)}” · +1 🪙</div><button class="btn block" style="margin-top:12px" onclick="Q.sp.after()">Next ▶</button>`;return}
  sBad();
  out.innerHTML=`<div class="verdict-line" style="color:var(--bad)">I heard “${esc(heard||'…')}”. ${Q.sp.tries<2?'Try once more!':'Nice try!'}</div>
   <div class="row" style="justify-content:center;gap:8px;margin-top:10px">${Q.sp.tries>=2?`<button class="btn ghost" onclick="Q.sp.after()">Skip ▶</button><button class="btn ghost" onclick="speakResult(true,'(grown-up checked)')">✓ Grown-up: it was right</button>`:''}</div>`;
}
function speakFail(msg){const out=$('#srout');if(out)out.innerHTML=`<div class="muted">${esc(msg)}</div><button class="btn ghost block" style="margin-top:10px" onclick="Q.sp.after()">Skip ▶</button>`}

/* ============ BACKUP / RESTORE ============ */
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}
function backupCode(){
  const json=JSON.stringify(S);
  return 'QPK1:'+btoa(unescape(encodeURIComponent(json)));
}
function readCode(code){
  code=(code||'').trim();
  if(code.startsWith('{'))return JSON.parse(code);
  const m=code.match(/QPK1:([A-Za-z0-9+/=\s]+)/);if(!m)throw new Error('not a Quest PK code');
  return JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/\s/g,'')))));
}
function backupScreen(){
  const code=backupCode(),kb=Math.round(code.length/1024*10)/10;
  setLayer(`<div class="modal" onclick="if(event.target===this)setLayer('')"><div class="card">
   <h2>💾 Save &amp; restore progress</h2>
   <p class="muted">Progress is kept on this iPad. Save a copy before deleting the app icon, changing iPad, or clearing Safari — then paste it back here.</p>
   <label class="l">1 · Save a copy</label>
   <div class="row wrap">
     <button class="btn" onclick="copyCode()">📋 Copy progress code</button>
     <a class="btn ghost" id="dl" download="quest-pk-progress-${today()}.txt" href="data:text/plain;charset=utf-8,${encodeURIComponent(code)}" style="text-decoration:none">⬇️ Save as file</a>
   </div>
   <p class="small muted">Paste the copied code into Notes or WhatsApp it to yourself (${kb} KB, ${S.profiles.length} player${S.profiles.length===1?'':'s'}).</p>
   <label class="l">2 · Restore from a copy</label>
   <textarea id="rc" rows="4" placeholder="Paste a progress code here…" style="width:100%;font:inherit;font-size:14px;padding:10px;border-radius:14px;border:2px solid #e2e3f5"></textarea>
   <div class="row wrap" style="margin-top:8px">
     <button class="btn purple" onclick="restoreFrom($('#rc').value)">Restore</button>
     <label class="btn ghost" style="cursor:pointer">📂 From file<input type="file" accept=".txt,text/plain" style="display:none" onchange="restoreFile(this)"></label>
   </div>
   <p class="small muted">Restoring replaces the progress on this iPad.</p>
   <button class="btn ghost block" style="margin-top:14px" onclick="setLayer('')">Close</button>
  </div></div>`);
}
function copyCode(){
  S.lastBackup=today();S.lastBackupN=S.profiles.reduce((a,p)=>a+p.stats.answered,0);save();
  const code=backupCode();
  try{navigator.clipboard.writeText(code).then(()=>miniToast('✅ Copied — paste it into Notes'),()=>showCodeBox(code))}catch(e){showCodeBox(code)}
}
function showCodeBox(code){const t=$('#rc');if(t){t.value=code;t.select();miniToast('Select all & copy the code in the box')}}
function restoreFile(inp){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>restoreFrom(r.result);r.readAsText(f)}
function restoreFrom(code){
  try{const d=readCode(code);if(!d||!Array.isArray(d.profiles))throw new Error('no players');
    S=d;S.profiles.forEach(migrate);save();setLayer('');home();miniToast(`✅ Restored ${S.profiles.length} player${S.profiles.length===1?'':'s'}`);
  }catch(e){miniToast('❌ That code didn\'t work — check it was copied in full')}
}
/* remind to back up now and then */
function backupNudge(){
  const n=S.profiles.reduce((a,p)=>a+(p.stats?p.stats.answered:0),0);
  return n>=30&&(!S.lastBackup||n-S.lastBackupN>=150);
}

/* ============ REMOTE BOSS PK (live, two devices, via PeerJS / WebRTC) ============
   Kid's iPad = host: owns the rope, timer and result. Grown-up's device = guest: answers its own
   questions and sends a "pull" for every right answer. Invite goes by the iPad's Share sheet
   (Messages / Mail / AirDrop) or by reading out a 4-letter room code. */
const RM={peer:null,conn:null,code:null,role:null,guest:null,host:null,timer:null};
const REMOTE_OK=typeof window.RTCPeerConnection!=='undefined'&&typeof window.Peer!=='undefined'&&/^https?:/.test(location.protocol);
const PEER_OPTS=window.PEER_OPTS||{debug:0,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'}]}};
const CODE_CHARS='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const newCode=()=>Array.from({length:4},()=>CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)]).join('');
const peerId=c=>'questpk-'+c.toUpperCase();
function rmClose(){try{RM.conn&&RM.conn.close()}catch(e){}try{RM.peer&&RM.peer.destroy()}catch(e){}clearTimeout(RM.timer);Object.assign(RM,{peer:null,conn:null,code:null,role:null,guest:null,host:null})}
function rmSend(m){try{if(RM.conn&&RM.conn.open)RM.conn.send(m)}catch(e){}}
function joinUrl(code){return location.origin+location.pathname+'#join-'+code}

/* ---------- HOST (child's iPad) ---------- */
function remoteHost(){
  rmClose();primeSpeech();
  const kid=cur(),st=stageById(STAGE);
  RM.role='host';RM.code=newCode();
  app().innerHTML=`<div class="top"><button class="back" onclick="rmClose();bossSetup()">‹</button><h1>🌏 Invite a far-away Boss</h1></div>
   <div class="card center" id="rmcard"><div style="font-size:60px">📡</div><h2>Getting a room ready…</h2></div>`;
  let peer;
  try{peer=new Peer(peerId(RM.code),PEER_OPTS)}catch(e){return rmFail('This device can\'t start a live game.')}
  RM.peer=peer;
  peer.on('open',()=>rmWaiting(kid,st));
  peer.on('error',err=>{
    if(err.type==='unavailable-id'){return remoteHost()}
    if(RM.role==='host'&&!(B&&B.remote))rmFail(err.type==='network'||err.type==='server-error'||err.type==='socket-error'?'Can\'t reach the live-game server. Check the iPad is online.':'Something went wrong starting the room ('+err.type+').');
  });
  peer.on('connection',conn=>{
    if(RM.conn&&RM.conn.open){try{conn.close()}catch(e){};return}
    RM.conn=conn;
    conn.on('data',m=>hostData(m));
    conn.on('close',()=>{if(B&&B.remote&&!B.over){miniToast('📴 '+(RM.guest?RM.guest.name:'The Boss')+' left the game');endBoss('draw')}else if(RM.role==='host'&&document.getElementById('rmwait'))rmWaiting(cur(),stageById(STAGE))});
  });
}
function rmWaiting(kid,st){
  const url=joinUrl(RM.code);
  const card=$('#rmcard');if(!card)return;
  card.id='rmcard';card.innerHTML=`<div id="rmwait"></div><div style="font-size:56px">⚔️</div>
    <h2>${esc(kid.name)} is waiting for a Boss…</h2>
    <p class="muted">Send the invite, or read the room code out over the phone.</p>
    <div class="roomcode">${RM.code.split('').map(c=>`<span>${c}</span>`).join('')}</div>
    <div class="row wrap" style="justify-content:center;margin-top:14px">
      <a class="btn" style="text-decoration:none" href="${rmSmsHref()}">💬 Send by iMessage</a>
      ${navigator.share?`<button class="btn ghost" onclick="rmShare()">📤 Other ways</button>`:''}
      <button class="btn ghost" onclick="rmCopy()">🔗 Copy link</button></div>
    <p class="small muted" style="margin-top:14px">The Boss opens Quest PK → <b>Join a far-away Boss PK</b> → types <b>${RM.code}</b>.<br>Or taps the link: <span style="word-break:break-all">${esc(url)}</span></p>
    <label class="l" style="text-align:left">Boss strength</label>
    <div class="seg"><button class="${bossOpts.strength==='gentle'?'on':''}" onclick="bossOpts.strength='gentle';rmWaiting(cur(),stageById(STAGE))">😊 Gentle</button><button class="${bossOpts.strength==='fierce'?'on':''}" onclick="bossOpts.strength='fierce';rmWaiting(cur(),stageById(STAGE))">😈 Fierce</button></div>
    <div class="waitdots" style="margin-top:18px">Waiting<span>.</span><span>.</span><span>.</span></div>`;
}
function rmInviteText(){const kid=cur(),st=stageById(STAGE);return `⚔️ ${kid.name} challenges you to a ${st.subj} Boss PK in Quest PK! Tap to join: ${joinUrl(RM.code)} (room code ${RM.code})`}
function rmSmsHref(){return 'sms:&body='+encodeURIComponent(rmInviteText())}
function rmShare(){
  const kid=cur(),st=stageById(STAGE),url=joinUrl(RM.code);
  navigator.share({title:'Quest PK challenge',text:`⚔️ ${kid.name} challenges you to a ${st.subj} Boss PK in Quest PK! Room code: ${RM.code}`,url}).catch(()=>{});
}
function rmCopy(){const url=joinUrl(RM.code);try{navigator.clipboard.writeText(`Quest PK challenge — room ${RM.code}: ${url}`).then(()=>miniToast('✅ Link copied'),()=>miniToast(url))}catch(e){miniToast(url)}}
function rmFail(msg){
  rmClose();
  app().innerHTML=`<div class="top"><button class="back" onclick="bossSetup()">‹</button><h1>🌏 Far-away Boss PK</h1></div>
   <div class="card center"><div style="font-size:60px">📴</div><h2>Couldn't connect</h2><p class="muted">${esc(msg)}</p>
   <p class="small muted">Live games need both devices online. Some school or office Wi-Fi blocks them — try home Wi-Fi or mobile data.</p>
   <button class="btn block" onclick="bossSetup()">Back</button></div>`;
}
function hostData(m){
  if(!m||!m.t)return;
  if(m.t==='hello'){
    RM.guest={name:String(m.name||'Boss').slice(0,14),av:m.av||GUEST_AVS[0]};
    miniToast(`⚔️ ${esc(RM.guest.name)} has joined!`);beep(880,.15,'triangle');
    startRemoteBoss();
  }else if(m.t==='pull'&&B&&B.remote&&!B.over){
    B.p--;B.as++;sBad();moveKnot();drawRemotePanel();
    if(Math.abs(B.p)>=LIMIT)endBoss('adult');
  }else if(m.t==='quit'){if(B&&B.remote&&!B.over){miniToast(RM.guest.name+' left the game');endBoss('draw')}}
}
function startRemoteBoss(){
  const kid=cur(),g=RM.guest,st=stageById(STAGE);
  const ad={id:'remote',name:g.name,av:g.av,kind:'adult',boss:{w:0,l:0,d:0}};
  B=newB(kid,ad,{remote:true});
  rmSend({t:'start',sid:STAGE,ch:B.ch,stage:st.chapters[B.ch].boss[1],subj:st.subj,kid:{name:kid.name,av:avOf(kid)},strength:bossOpts.strength,limit:LIMIT,dur:90,p:B.p,rec:rivalRec(kid,ad)});
  app().innerHTML='';
  setLayer(`<div class="arena remote">
    <div class="rpanel" id="h-adult"></div>
    <div class="mid"><button class="bossexit" onclick="endBoss(null)">✕</button>
      ${avMini(ad)}<div class="rope"><span class="knot" id="knot">⭐</span></div>${avMini(kid)}<div class="timer" id="timer">90</div></div>
    <div class="half kid" id="h-kid"></div></div>`);
  drawRemotePanel();
  countdown(()=>{
    if(!B||B.over)return;
    newBossQ('kid');moveKnot();rmSend({t:'go'});
    B.timer=setInterval(()=>{B.t--;$('#timer').textContent=B.t;rmState();if(B.t<=10)beep(400,.05);if(B.t<=0)endBoss(B.p>0?'kid':B.p<0?'adult':'draw')},1000);
  });
}
function countdown(done){
  const el=document.createElement('div');el.className='countdown';document.body.appendChild(el);
  let n=3;const tick=()=>{if(n===0){el.textContent='GO!';beep(990,.2,'triangle');setTimeout(()=>{el.remove();done()},500);return}
    el.textContent=n;beep(520,.12,'triangle');n--;setTimeout(tick,800)};tick();
}
function drawRemotePanel(){
  const el=$('#h-adult');if(!el||!B)return;
  el.innerHTML=`<div class="who">${avatar(B.ad,40)}<span>${esc(B.ad.name)} · BOSS <span class="small" style="opacity:.8">🌏 playing remotely</span></span><span class="sc">✓ ${B.as}</span></div>`;
}
function rmState(){if(B&&B.remote)rmSend({t:'state',p:B.p,time:B.t,ks:B.ks,as:B.as})}

/* ---------- GUEST (grown-up's device) ---------- */
const GUEST_AVS=[{sp:'bunny',col:'#f472b6',eye:'happy',mouth:'smile',hat:'flower',face:'glasses',neck:''},{sp:'bear',col:'#94a3b8',eye:'round',mouth:'smile',hat:'cap',face:'glasses',neck:''},
 {sp:'cat',col:'#a78bfa',eye:'sparkle',mouth:'cat',hat:'bow',face:'',neck:''},{sp:'bear',col:'#8b5e3c',eye:'round',mouth:'grin',hat:'',face:'',neck:'bowtie'},{sp:'dino',col:'#4ade80',eye:'round',mouth:'fangs',hat:'',face:'',neck:''},{sp:'panda',col:'#ff8a3d',eye:'sparkle',mouth:'grin',hat:'',face:'',neck:''}];
let GJ={name:'',av:GUEST_AVS[0],adultId:null},GG=null;
function joinScreen(code){
  rmClose();
  const ads=S.profiles.filter(p=>p.kind==='adult');
  if(ads.length&&!GJ.adultId&&!GJ.name){const a=ads[0];GJ={name:a.name,av:avOf(a),adultId:a.id}}
  app().innerHTML=`<div class="top"><button class="back" onclick="home()">‹</button><h1>🌏 Join a far-away Boss PK</h1></div>
   <div class="card">
    <label class="l">Room code</label>
    <input type="text" id="jcode" maxlength="4" value="${esc(code||'')}" placeholder="e.g. K7QM" autocapitalize="characters" style="text-transform:uppercase;font-size:32px;letter-spacing:10px;text-align:center">
    <label class="l">Who's playing?</label>
    ${ads.length?`<div class="row wrap" style="margin-bottom:8px">${ads.map(a=>`<button onclick="GJ={name:getP('${a.id}').name,av:avOf(getP('${a.id}')),adultId:'${a.id}'};joinScreen($('#jcode').value)" style="background:${GJ.adultId===a.id?'#efeaff':'#f5f6ff'};border:3px solid ${GJ.adultId===a.id?'var(--adult)':'transparent'};border-radius:18px;padding:8px 12px" class="row">${avatar(a,36)}<b>${esc(a.name)}</b></button>`).join('')}</div>`:''}
    <input type="text" id="jname" maxlength="14" placeholder="Your name, e.g. Grandma" value="${esc(GJ.name)}" oninput="GJ.name=this.value;GJ.adultId=null">
    <div class="grid-pick" style="margin-top:10px">${GUEST_AVS.map((v,i)=>`<button class="${JSON.stringify(GJ.av)===JSON.stringify(v)?'on':''}" onclick="GJ.av=GUEST_AVS[${i}];GJ.adultId=null;GJ.name=$('#jname').value;joinScreen($('#jcode').value)">${avatarSVG(v,52)}</button>`).join('')}</div>
    <button class="btn purple block" style="margin-top:18px" onclick="joinGo()">⚔️ Join the battle</button>
    <p class="small muted" style="margin-top:12px">You'll get the grown-up (secondary-school) questions. Keep this screen open — the battle starts as soon as you join.</p>
   </div>`;
}
function joinGo(){
  const code=($('#jcode').value||'').trim().toUpperCase();
  GJ.name=($('#jname').value||GJ.name||'').trim();
  if(code.length!==4){miniToast('Type the 4-letter room code');return}
  if(!GJ.name){miniToast('Add your name');return}
  rmClose();RM.role='guest';RM.code=code;primeSpeech();
  app().innerHTML=`<div class="card center" style="margin-top:30px"><div style="font-size:60px">📡</div><h2>Joining room ${esc(code)}…</h2><div class="waitdots">Connecting<span>.</span><span>.</span><span>.</span></div>
    <button class="btn ghost" style="margin-top:16px" onclick="rmClose();joinScreen('${esc(code)}')">Cancel</button></div>`;
  let peer;try{peer=new Peer(PEER_OPTS)}catch(e){return joinFail('This device can\'t join live games.')}
  RM.peer=peer;
  RM.timer=setTimeout(()=>{if(!(RM.conn&&RM.conn.open))joinFail('No answer from room '+code+'. Check the code, and that the child\'s iPad is still on the waiting screen.')},20000);
  peer.on('open',()=>{
    const conn=peer.connect(peerId(code),{reliable:true});RM.conn=conn;
    conn.on('open',()=>{clearTimeout(RM.timer);rmSend({t:'hello',name:GJ.name,av:GJ.av});
      app().innerHTML=`<div class="card center" style="margin-top:30px"><div style="font-size:60px">🤝</div><h2>Connected!</h2><p class="muted">Get ready…</p></div>`});
    conn.on('data',m=>guestData(m));
    conn.on('close',()=>{if(GG&&!GG.over){GG.over=true;guestEnd({result:'draw',reason:'left'})}});
  });
  peer.on('error',err=>{if(err.type==='peer-unavailable')joinFail('Room '+code+' wasn\'t found. Check the code with the child — it changes every game.');else if(!(GG&&!GG.over))joinFail('Connection problem ('+err.type+'). Check you\'re online.')});
}
function joinFail(msg){
  rmClose();
  app().innerHTML=`<div class="top"><button class="back" onclick="home()">‹</button><h1>🌏 Join a Boss PK</h1></div>
   <div class="card center"><div style="font-size:60px">📴</div><h2>Couldn't join</h2><p class="muted">${esc(msg)}</p>
   <p class="small muted">Some office or school Wi-Fi blocks live games — try home Wi-Fi or mobile data.</p>
   <button class="btn block" onclick="joinScreen('${esc(RM.code||'')}')">Try again</button></div>`;
}
function guestData(m){
  if(!m||!m.t)return;
  if(m.t==='start'){
    GG={sid:m.sid,rec:m.rec,stage:m.stage,subj:m.subj,kid:m.kid,strength:m.strength,limit:m.limit||6,p:m.p||0,time:m.dur||90,ks:0,as:0,over:false,seen:new Set(),q:null,lock:false,started:false};
    STAGE=m.sid;guestRender();countdown(()=>{});
  }else if(m.t==='go'&&GG){GG.started=true;guestNewQ()}
  else if(m.t==='state'&&GG){Object.assign(GG,{p:m.p,time:m.time,ks:m.ks,as:m.as});guestBar()}
  else if(m.t==='end'&&GG){GG.over=true;guestEnd(m)}
  else if(m.t==='cancel'){GG=null;miniToast('The child stopped the game');joinScreen(RM.code)}
}
function guestRender(){
  const g=GG;
  app().innerHTML='';
  setLayer(`<div class="arena guest">
    <div class="half adult" id="g-q"><div class="center" style="color:#fff;font-size:22px;font-weight:700">Get ready to defend the ${esc(g.stage)}!</div></div>
    <div class="mid"><button class="bossexit" onclick="rmSend({t:'quit'});GG=null;setLayer('');rmClose();home()">✕</button>
      ${avMini({av:GJ.av})}<div class="rope"><span class="knot" id="knot">⭐</span></div>${avMini({av:g.kid.av})}<div class="timer" id="timer">${g.time}</div></div>
    <div class="rpanel kidp" id="g-kid"></div></div>`);
  guestBar();
}
function guestBar(){
  const g=GG;if(!g)return;
  const k=$('#knot');if(k)k.style.left=((g.p+g.limit)/(2*g.limit)*100)+'%';
  const t=$('#timer');if(t)t.textContent=g.time;
  const kp=$('#g-kid');if(kp)kp.innerHTML=`<div class="who">${avatar({av:g.kid.av},40)}<span>${esc(g.kid.name)} <span class="small" style="opacity:.8">is answering…</span></span><span class="sc">✓ ${g.ks}</span></div>`;
}
function guestNewQ(){
  const g=GG;if(!g||g.over)return;
  if(g.seen.size>40)g.seen.clear();
  g.q=genQ(g.sid,7,g.seen);g.lock=false;guestDrawQ();
}
function guestDrawQ(){
  const g=GG,q=g.q,el=$('#g-q');if(!el||!q)return;
  el.classList.toggle('locked',g.lock);
  el.innerHTML=`<div class="who">${avatar({av:GJ.av},40)}<span>${esc(GJ.name)} · BOSS</span><span class="sc">✓ ${g.as}</span></div>
   <div class="bq ${q.big?(q.long?'long':''):'txt'}">${g.lock?'🥶 Frozen!':(q.passage?`<div style="font-size:15px;font-weight:500;text-align:left;margin-bottom:6px">${esc(q.passage)}</div>`:'')+esc(q.q)+(q.vis?`<div class="qvis">${q.vis}</div>`:'')}</div>
   <div class="opts ${q.layout}">${q.opts.map((o,k)=>`<button class="opt" onpointerdown="guestAns(${k},this)">${esc(o)}</button>`).join('')}</div>`;
}
function guestAns(k,el){
  const g=GG;if(!g||g.over||g.lock||!g.started)return;
  if(g.q.opts[k]===g.q.ans){el.classList.add('right');sGood();rmSend({t:'pull'});g.as++;setTimeout(guestNewQ,250)}
  else{el.classList.add('wrong');sBad();g.lock=true;const fr=g.strength==='gentle'?2500:1300;
    setTimeout(()=>{if(!GG||GG.over)return;guestDrawQ();setTimeout(()=>{if(GG&&!GG.over)guestNewQ()},fr)},350)}
}
function guestEnd(m){
  const g=GG||{kid:{name:'The child'},stage:'castle',ks:0,as:0};setLayer('');
  S.guestRivals=S.guestRivals||{};const gk=(GJ.name+'>'+g.kid.name).toLowerCase(),gr=S.guestRivals[gk]||(S.guestRivals[gk]={me:GJ.name,kid:g.kid.name,w:0,l:0,d:0});
  const won=m.result==='adult',draw=m.result==='draw';
  if(m.reason!=='left'){if(won)gr.w++;else if(draw)gr.d++;else gr.l++}
  if(GJ.adultId&&m.reason!=='left'){const a=getP(GJ.adultId);if(a){if(won)a.boss.w++;else if(draw)a.boss.d++;else a.boss.l++}}save();
  if(won)sWin();
  app().innerHTML=`<div class="card center" style="margin-top:30px">
    <div style="font-size:90px">${m.reason==='left'?'📴':won?'🐲':draw?'🤝':'🏆'}</div>
    <h2>${m.reason==='left'?'The connection ended':won?(gr.w>1?`You beat ${esc(g.kid.name)} again!`:`You defended the ${esc(g.stage)}!`):draw?"It's a draw!":`${esc(g.kid.name)} beat you!`}</h2>
    <p class="muted">Score: ${esc(g.kid.name)} ${m.ks??g.ks} – ${m.as??g.as} ${esc(GJ.name)}</p>
    <p>All-time vs ${esc(g.kid.name)}: <b>you ${gr.w} – ${gr.l} ${esc(g.kid.name)}</b>${gr.d?` (${gr.d} draws)`:''}</p>
    <p class="small muted">Waiting here means ${esc(g.kid.name)} can start a rematch.</p>
    <button class="btn ghost block" onclick="rmClose();GG=null;home()">Leave</button></div>`;
}
/* links like …/quest-pk/#join-K7QM open straight into the join screen */
function checkJoinLink(){
  const m=(location.hash||'').match(/^#join-([A-Za-z0-9]{4})$/);
  if(m){try{history.replaceState(null,'',location.pathname)}catch(e){}joinScreen(m[1].toUpperCase());return true}
  return false;
}

applySeason();
window.addEventListener('hashchange',checkJoinLink);
if(!checkJoinLink())home();
setTimeout(()=>checkUpdate(false),800);

if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
