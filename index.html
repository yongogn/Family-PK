<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Family PK 一家PK</title>
<meta name="theme-color" content="#FFF7EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Family PK">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --cream:#FFF7EC; --paper:#FFFFFF; --ink:#2A2140; --muted:#7A7090; --line:#EDE3D3;
    --red:#E5503A; --red-soft:#FDE6E1; --blue:#3A63E0; --blue-soft:#E3EAFD;
    --jade:#21A072; --jade-soft:#DDF5EC; --gold:#F2B33D; --gold-soft:#FFF1D2; --wrong:#D9433A;
    --hz:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
    --ui:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--ui);-webkit-user-select:none;user-select:none}
  body{min-height:100vh;display:flex;justify-content:center}
  #app{width:100%;max-width:560px;padding:calc(18px + env(safe-area-inset-top)) 18px calc(32px + env(safe-area-inset-bottom));min-height:100vh;display:flex;flex-direction:column}
  h1,h2,h3,p{margin:0}
  button{font-family:inherit;cursor:pointer;border:none;color:inherit}
  textarea{font-family:ui-monospace,Menlo,monospace;-webkit-user-select:text;user-select:text}
  .brand{display:flex;align-items:center;gap:10px;margin:6px 0 18px}
  .brand .logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--red),var(--gold));display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px;box-shadow:0 4px 0 #b83a28}
  .brand h1{font-size:26px;font-weight:800;line-height:1}
  .brand h1 span{font-family:var(--hz);color:var(--red);font-size:22px;margin-left:4px}
  .brand small{display:block;color:var(--muted);font-size:13px;font-weight:500;margin-top:3px}
  .card{background:var(--paper);border-radius:20px;padding:16px;box-shadow:0 2px 0 var(--line),0 8px 24px rgba(42,33,64,.06);margin-bottom:14px}
  .label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .streak{display:flex;align-items:center;gap:14px}
  .streak .flame{font-size:40px;line-height:1}
  .streak b{font-size:30px;line-height:1}
  .streak p{color:var(--muted);font-size:14px;line-height:1.3}
  .btn{display:block;width:100%;padding:15px 18px;border-radius:16px;font-size:19px;font-weight:700;color:#fff;background:var(--red);box-shadow:0 4px 0 #b83a28;transition:transform .06s}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b83a28}
  .btn.blue{background:var(--blue);box-shadow:0 4px 0 #2a49a8}
  .btn.jade{background:var(--jade);box-shadow:0 4px 0 #177553}
  .btn.ghost{background:var(--paper);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
  .btn.small{padding:10px 14px;font-size:16px}
  .btn + .btn{margin-top:12px}
  .lb-row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-top:1px solid var(--line);width:100%;background:none;text-align:left}
  .lb-row:first-of-type{border-top:none}
  .lb-row .av{font-size:26px}
  .lb-row .nm{flex:1;font-weight:600;font-size:17px;line-height:1.15}
  .lb-row .nm small{display:block;color:var(--muted);font-weight:500;font-size:13px}
  .lb-row .w{font-weight:800;font-size:18px;text-align:right;line-height:1.1}
  .lb-row .w small{display:block;font-weight:500;color:var(--muted);font-size:12px}
  .lb-row .chev{color:var(--muted);font-size:20px}
  .empty{color:var(--muted);font-size:15px}
  .locked{display:flex;align-items:center;gap:12px;border:2px dashed var(--gold);background:var(--gold-soft);box-shadow:none;width:100%;text-align:left}
  .locked .ic{font-size:28px}
  .locked b{display:block;font-size:16px}
  .locked span{font-size:13px;color:var(--muted)}
  .links{display:flex;justify-content:center;gap:18px;margin-top:auto;padding-top:16px}
  .links button{background:none;color:var(--muted);font-size:14px;font-weight:600;text-decoration:underline}
  .footnote{text-align:center;color:var(--muted);font-size:12px;margin-top:8px}

  /* setup */
  .pcard{border-radius:20px;padding:14px;margin-bottom:14px;border:3px solid transparent}
  .pcard.p0{background:var(--red-soft);border-color:var(--red)}
  .pcard.p1{background:var(--blue-soft);border-color:var(--blue)}
  .pcard .corner{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
  .p0 .corner{color:var(--red)} .p1 .corner{color:var(--blue)}
  .saved{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .saved button{background:#fff;border-radius:999px;padding:4px 10px 4px 6px;font-size:14px;font-weight:600;border:2px solid transparent}
  .saved button.on{border-color:var(--ink)}
  .pcard input{width:100%;font-family:inherit;font-size:19px;font-weight:600;padding:10px 12px;border-radius:12px;border:2px solid rgba(0,0,0,.08);background:#fff;color:var(--ink);outline:none;-webkit-user-select:text;user-select:text}
  .avatars{display:flex;gap:6px;margin:10px 0}
  .avatars button{flex:1;font-size:24px;padding:6px 0;border-radius:12px;background:rgba(255,255,255,.6);border:2px solid transparent}
  .avatars button.on{background:#fff;border-color:var(--ink)}
  .levels{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .levels button{padding:8px 6px;border-radius:12px;background:rgba(255,255,255,.6);font-size:14px;font-weight:600;border:2px solid transparent;line-height:1.15}
  .levels button small{display:block;font-weight:500;color:var(--muted);font-size:12px}
  .levels button.on{background:#fff;border-color:var(--ink)}
  .vs{text-align:center;font-weight:800;font-size:22px;color:var(--gold);margin:-6px 0 8px}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px}
  .back{background:none;font-size:16px;color:var(--muted);font-weight:600;padding:4px 0}

  /* handoff */
  .handoff{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:18px}
  .handoff .big-av{font-size:96px;line-height:1}
  .handoff h2{font-size:30px;line-height:1.1}
  .handoff p{color:var(--muted);font-size:16px}

  /* question */
  .qhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .qhead .who{display:flex;align-items:center;gap:6px;font-weight:700;font-size:16px;padding:4px 10px 4px 6px;border-radius:999px}
  .who.p0{background:var(--red-soft);color:var(--red)} .who.p1{background:var(--blue-soft);color:var(--blue)}
  .qhead .score{margin-left:auto;font-weight:800;font-size:18px}
  .dots{display:flex;gap:5px;margin-bottom:10px}
  .dots i{flex:1;height:7px;border-radius:9px;background:var(--line)}
  .dots i.ok{background:var(--jade)} .dots i.no{background:var(--wrong)} .dots i.cur{background:var(--gold)}
  .timer{height:10px;border-radius:10px;background:var(--line);overflow:hidden;margin-bottom:14px}
  .timer div{height:100%;background:var(--jade);border-radius:10px;transition:width .1s linear}
  .timer div.warn{background:var(--gold)} .timer div.danger{background:var(--wrong)}
  .prompt{background:var(--paper);border-radius:22px;padding:22px 16px;text-align:center;box-shadow:0 2px 0 var(--line),0 8px 24px rgba(42,33,64,.06);margin-bottom:14px;min-height:190px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px}
  .prompt .ask{font-size:14px;color:var(--muted);font-weight:600}
  .prompt .hzbig{font-family:var(--hz);font-size:60px;font-weight:600;line-height:1.15;letter-spacing:.04em}
  .prompt .hzbig.idiom{font-size:48px}
  .prompt .py{font-size:20px;color:var(--red);font-weight:600;min-height:26px}
  .prompt .en{font-size:28px;font-weight:700;line-height:1.15}
  .newword{font-size:12px;font-weight:700;color:var(--jade);background:var(--jade-soft);border-radius:999px;padding:2px 10px}
  .reviseword{font-size:12px;font-weight:700;color:#a36a00;background:var(--gold-soft);border-radius:999px;padding:2px 10px}
  .listen{width:100px;height:100px;border-radius:50%;background:var(--gold);font-size:44px;box-shadow:0 5px 0 #c58c1f}
  .listen:active{transform:translateY(3px);box-shadow:0 2px 0 #c58c1f}
  .tools{display:flex;gap:8px;justify-content:center}
  .chip{background:var(--cream);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600}
  .chip[disabled]{opacity:.45}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .opt{background:var(--paper);border-radius:18px;padding:14px 8px;min-height:88px;font-size:18px;font-weight:600;box-shadow:0 4px 0 var(--line);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.2}
  .opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
  .opt .ohz{font-family:var(--hz);font-size:32px;font-weight:600}
  .opt .ohz.idiom{font-size:23px}
  .opt .opy{font-size:13px;color:var(--muted);font-weight:500}
  .opt.correct{background:var(--jade-soft);border-color:var(--jade);box-shadow:0 4px 0 var(--jade)}
  .opt.wrong{background:#FCE3E1;border-color:var(--wrong);box-shadow:0 4px 0 var(--wrong)}
  .opt.dim{opacity:.45}
  .reveal{margin-top:14px;border-radius:18px;padding:14px;display:flex;align-items:center;gap:12px}
  .reveal.good{background:var(--jade-soft)} .reveal.bad{background:#FCE3E1}
  .reveal .rhz{font-family:var(--hz);font-size:30px;font-weight:700}
  .reveal .rtxt{flex:1;line-height:1.25}
  .reveal .rtxt b{font-size:17px}
  .reveal .rtxt small{display:block;color:var(--muted);font-size:14px}
  .reveal .pts{font-weight:800;font-size:20px;color:var(--jade)}
  .reveal.bad .pts{color:var(--wrong)}
  .say{background:#fff;border-radius:50%;width:42px;height:42px;font-size:18px;flex:none}
  .next{margin-top:12px}

  /* results */
  .winner{text-align:center;padding:10px 0 4px}
  .winner .crown{font-size:46px;line-height:1}
  .winner .wav{font-size:84px;line-height:1}
  .winner h2{font-size:30px;margin-top:6px;line-height:1.1}
  .winner p{color:var(--muted);font-size:15px;margin-top:4px}
  .scores{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 14px}
  .sc{border-radius:18px;padding:12px;text-align:center}
  .sc.p0{background:var(--red-soft)} .sc.p1{background:var(--blue-soft)}
  .sc .n{font-weight:700;font-size:16px}
  .sc .s{font-weight:800;font-size:32px;line-height:1.1}
  .p0 .s{color:var(--red)} .p1 .s{color:var(--blue)}
  .sc small{color:var(--muted);font-size:13px;display:block}
  .sc .lvl{font-size:12px;color:var(--muted)}
  .sc .gain{font-size:13px;font-weight:700;color:var(--jade);margin-top:4px}
  .newbadges{background:var(--gold-soft);border:2px solid var(--gold);box-shadow:none}
  .nb-row{display:flex;align-items:center;gap:12px;padding:6px 0}
  .nb-row .bi{font-size:34px}
  .nb-row b{display:block;font-size:17px}
  .nb-row span{font-size:13px;color:var(--muted)}
  .nudge{background:var(--jade-soft);box-shadow:none;display:flex;gap:12px;align-items:center}
  .nudge .ic{font-size:30px}
  .nudge p{font-size:15px;line-height:1.35}
  .review-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
  .review-row:first-of-type{border-top:none}
  .review-row .rhz{font-family:var(--hz);font-size:24px;font-weight:600;min-width:72px}
  .review-row .rtxt{flex:1;line-height:1.2}
  .review-row .rtxt small{display:block;color:var(--muted);font-size:13px}
  .review-row .whose{font-size:18px}
  .review-row .say{background:var(--cream)}

  /* profile */
  .phead{display:flex;align-items:center;gap:14px;margin-bottom:14px}
  .phead .pav{font-size:64px;line-height:1}
  .phead h2{font-size:28px;line-height:1.1}
  .phead p{color:var(--muted);font-size:14px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
  .stat{background:var(--paper);border-radius:16px;padding:10px 4px;text-align:center;box-shadow:0 2px 0 var(--line)}
  .stat b{display:block;font-size:24px;line-height:1.1}
  .stat span{font-size:12px;color:var(--muted);font-weight:600}
  .chart svg{width:100%;height:auto;display:block}
  .chart .note{font-size:13px;color:var(--muted);margin-top:6px}
  .pack{margin:10px 0}
  .pack .top{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:4px}
  .pack .top span{color:var(--muted);font-weight:500}
  .bar{height:12px;border-radius:12px;background:var(--line);overflow:hidden}
  .bar div{height:100%;background:var(--jade);border-radius:12px}
  .badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .badge{border-radius:16px;padding:10px 6px;text-align:center;background:var(--gold-soft);border:2px solid var(--gold)}
  .badge .bi{font-size:30px;line-height:1.1}
  .badge b{display:block;font-size:13px;line-height:1.15;margin-top:4px}
  .badge span{display:block;font-size:11px;color:var(--muted);line-height:1.2;margin-top:2px}
  .badge.off{background:#F6F2EA;border-color:transparent}
  .badge.off .bi{filter:grayscale(1);opacity:.35}
  .badge.off b{color:var(--muted)}

  /* modal */
  .modal{position:fixed;inset:0;background:rgba(42,33,64,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
  .modal .box{background:var(--paper);border-radius:22px;padding:20px;width:100%;max-width:420px;text-align:center;max-height:90vh;overflow:auto}
  .modal h3{font-size:22px;margin-bottom:6px}
  .modal p{color:var(--muted);font-size:15px;margin-bottom:14px;line-height:1.35}
  .modal textarea{width:100%;height:110px;border-radius:12px;border:2px solid var(--line);padding:10px;font-size:12px;margin-bottom:10px;resize:none}
  .modal .msg{font-size:14px;font-weight:600;min-height:20px;margin-bottom:8px}
  .hold{position:relative;overflow:hidden}
  .hold .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.3)}
  .hold span{position:relative}
  .gate-opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .gate-opts button{padding:12px 0;border-radius:12px;background:var(--cream);border:2px solid var(--line);font-size:20px;font-weight:700}
  ul.how{text-align:left;padding-left:20px;margin:0 0 14px;font-size:15px;line-height:1.45}
  @keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
  .pop{animation:pop .35s ease-out}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  body.playing .listen, body.playing #say, body.playing #say2{animation:pulse .5s ease-in-out infinite}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .shake{animation:shake .25s ease-in-out 2}
  @media (min-width:700px){ .prompt .hzbig{font-size:72px} .opt{min-height:100px} .opt .ohz{font-size:36px} }
</style>
</head>

<div id="app"></div>

function load(){
  let s = null;
  try{ s = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!s){
    s = {};
    try{ // carry over the first prototype's leaderboard
      const old = JSON.parse(localStorage.getItem("familypk.v1"));
      if(old){ s.players = old.players; s.streak = old.streak; s.last = old.last;
        s.profiles = {}; for(const [n,b] of Object.entries(old.board||{})) s.profiles[n] = newProfile(b.avatar, b); }
    }catch(e){}
  }
  return s;
}

const player = new Audio();
player.preload = "auto";
player.setAttribute("playsinline","");
player.addEventListener("playing",()=>document.body.classList.add("playing"));
["ended","pause","error"].forEach(ev=>player.addEventListener(ev,()=>document.body.classList.remove("playing")));
let zhVoice = null;
const hasSynth = typeof window.speechSynthesis !== "undefined";
function pickVoice(){ try{ const vs = speechSynthesis.getVoices(); zhVoice = vs.find(v=>/zh[-_]CN/i.test(v.lang)) || vs.find(v=>/^zh/i.test(v.lang)) || null; }catch(e){} }
if(hasSynth){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }
function synth(text){
  if(!hasSynth) return;
  try{ const u = new SpeechSynthesisUtterance(text); u.lang = "zh-CN"; u.rate = 0.8; if(zhVoice) u.voice = zhVoice; speechSynthesis.speak(u); }catch(e){}
}
function speak(text){
  const clip = CLIPS[text];
  if(!clip){ synth(text); return; }
  try{
    player.pause(); player.src = "data:audio/mpeg;base64," + clip; player.currentTime = 0;
    const p = player.play(); if(p && p.catch) p.catch(()=>synth(text));
  }catch(e){ synth(text); }
}

/* ---------------- Helpers ---------------- */
const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const ymd = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today = () => ymd(new Date());
const yesterday = () => { const d=new Date(); d.setDate(d.getDate()-1); return ymd(d); };
function currentStreak(){ return (store.last===today()||store.last===yesterday()) ? store.streak : 0; }
const lvlName = k => LEVELS[k].label+" · "+LEVELS[k].sub;
function masteredIn(p, levelKey){ return LEVELS[levelKey].words.filter(w=>p.words[w[0]] && p.words[w[0]].m).length; }
function masteredTotal(p){ return Object.values(p.words).filter(x=>x.m).length; }

/* Smart revision: words you got wrong come back more often until mastered. */
function weight(rec){
  if(!rec) return 3;                 // new word
  if(rec.m) return 1;                // mastered: occasional check
  if(rec.bad>0) return 6 + Math.min(rec.bad,4); // needs revision
  return 3;
}
function makeQuestions(levelKey, p){
  const L = LEVELS[levelKey];
  let pool = L.words.map(w=>({w, wt:weight(p.words[w[0]])}));
  const picks = [];
  while(picks.length<QN && pool.length){
    let r = Math.random()*pool.reduce((s,x)=>s+x.wt,0);
    let idx = 0; for(; idx<pool.length; idx++){ r -= pool[idx].wt; if(r<=0) break; }
    idx = Math.min(idx, pool.length-1);
    picks.push(pool[idx].w); pool.splice(idx,1);
  }
  const types = shuffle(["meaning","meaning","meaning","hanzi","hanzi","hanzi","listen","listen"]);
  return shuffle(picks).map((w,i)=>{
    const others = shuffle(L.words.filter(x=>x[0]!==w[0])).slice(0,3);
    const rec = p.words[w[0]];
    return {w, type:types[i], opts:shuffle([w, ...others]), tag: !rec ? "new" : (!rec.m && rec.bad>0 ? "revise" : "")};
  });
}

let duel = null, timer = null;
function newDuel(firstIdx){
  const P = store.players;
  const order = firstIdx===1 ? [1,0] : [0,1];
  duel = {
    order, turn:0, q:0, first:order[0],
    qs: [0,1].map(i=>makeQuestions(P[i].level, profile(P[i].name, P[i].avatar))),
    res: [0,1].map(()=>({score:0, correct:0, marks:[], missed:[], times:[], listenOK:0, listenN:0, newMastered:[], comeback:false}))
  };
}

      ${savedNames.length?`<div class="saved">${savedNames.map(n=>`<button data-sp="${i}" data-n="${esc(n)}" class="${P[i].name===n?"on":""}">${store.profiles[n].avatar} ${esc(n)}</button>`).join("")}</div>`:""}

      <div class="avatars">${AVATARS.map(a=>`<button data-p="${i}" data-a="${a}" class="${P[i].avatar===a?"on":""}">${a}</button>`).join("")}</div>
      <div class="levels">${Object.entries(LEVELS).map(([k,L])=>`<button data-p="${i}" data-l="${k}" class="${P[i].level===k?"on":""}">${L.label}<small>${L.sub} · ${L.time}s</small></button>`).join("")}</div>
    </div>`;
  $app.innerHTML = `
    <div class="topbar"><button class="back" id="bk">← Back</button><b>Who's playing?</b><span style="width:48px"></span></div>
    ${card(0)}<div class="vs">VS</div>${card(1)}
    <button class="btn" id="start">Start duel</button>
    <p class="footnote">Each player gets questions at their own level. Grown-up levels get less time per question.</p>`;
  const syncNames = ()=>{ [0,1].forEach(i=>{ const v=document.getElementById("nm"+i).value.trim(); P[i].name = v || (i?"Player 2":"Player 1"); }); };
  $app.querySelectorAll("[data-sp]").forEach(b=>b.onclick=()=>{ syncNames(); const i=+b.dataset.sp, n=b.dataset.n;
    P[i].name=n; P[i].avatar=store.profiles[n].avatar;
    const h=store.profiles[n].history; if(h.length) P[i].level=h[h.length-1].lvl;
    save(); setup(); });
  $app.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{ syncNames(); P[+b.dataset.p].avatar=b.dataset.a; save(); setup(); });
  $app.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{ syncNames(); P[+b.dataset.p].level=b.dataset.l; save(); setup(); });
  document.getElementById("bk").onclick = ()=>{ syncNames(); save(); home(); };
  document.getElementById("start").onclick = ()=>{
    syncNames();
    if(P[0].name.toLowerCase()===P[1].name.toLowerCase()) P[1].name += " 2";
    save(); newDuel(store.nextFirst||0); handoff();
  };
}

function handoff(){
  stopTimer();
  const pi = duel.order[duel.turn], p = store.players[pi], L = LEVELS[p.level];
  const prev = duel.turn===1 ? store.players[duel.order[0]] : null;
  const revise = duel.qs[pi].filter(q=>q.tag==="revise").length;
  $app.innerHTML = `
    <div class="handoff">
      ${prev?`<p>🤫 ${esc(prev.name)}'s score is locked in — no peeking!</p>`:""}
      <div class="big-av pop">${p.avatar}</div>
      <h2>Pass the ${/iPad/.test(navigator.userAgent)||innerWidth>700?"iPad":"phone"} to<br>${esc(p.name)}</h2>
      <p>${QN} questions · ${lvlName(p.level)} · ${L.time}s each<br>${revise?`Includes ${revise} word${revise===1?"":"s"} to revise 🔁`:"Faster answers score more points."}</p>
      <button class="btn ${pi===0?"":"blue"}" id="ready">I'm ready!</button>
    </div>`;
  document.getElementById("ready").onclick = ()=>{ duel.q=0; question(); };
}

let qState = null;
function question(){
  stopTimer();
  const pi = duel.order[duel.turn], p = store.players[pi], L = LEVELS[p.level];
  const Q = duel.qs[pi][duel.q], [hz,py,en] = Q.w;
  const R = duel.res[pi];
  qState = {answered:false, hint:false, start:performance.now(), limit:L.time*1000};
  const showPy = L.pinyin, idiom = !!L.idiom;
  const tag = Q.tag==="new" ? `<span class="newword">NEW WORD</span>` : Q.tag==="revise" ? `<span class="reviseword">🔁 REVISE</span>` : "";

  let prompt = "";
  if(Q.type==="meaning"){
    prompt = `${tag}<div class="ask">What does this mean?</div>
      <div class="hzbig ${idiom?"idiom":""}">${hz}</div>
      <div class="py" id="py">${showPy?py:""}</div>
      <div class="tools"><button class="chip" id="say">🔊 Listen</button>${showPy?"":`<button class="chip" id="hint">拼音 hint −30</button>`}</div>`;
  }else if(Q.type==="hanzi"){
    prompt = `${tag}<div class="ask">Find the Chinese for…</div>
      <div class="en">${esc(en)}</div>
      <div class="tools">${showPy?"":`<button class="chip" id="hint">拼音 hint −30</button>`}</div>`;
  }else{
    prompt = `${tag}<div class="ask">Listen and pick the characters</div>
      <button class="listen" id="say">🔊</button>`;
  }
  const optHtml = Q.opts.map((o,i)=>{
    if(Q.type==="meaning") return `<button class="opt" data-i="${i}">${esc(o[2])}</button>`;
    const pyLine = (Q.type==="hanzi" && showPy) ? `<span class="opy">${o[1]}</span>` : `<span class="opy hidepy" style="display:none">${o[1]}</span>`;
    return `<button class="opt" data-i="${i}"><span class="ohz ${idiom?"idiom":""}">${o[0]}</span>${pyLine}</button>`;
  }).join("");

  $app.innerHTML = `
    <div class="qhead"><span class="who p${pi}">${p.avatar} ${esc(p.name)}</span><span class="score" id="sc">${R.score} pts</span></div>
    <div class="dots">${Array.from({length:QN},(_,i)=>`<i class="${i<duel.q?(R.marks[i]?"ok":"no"):(i===duel.q?"cur":"")}"></i>`).join("")}</div>
    <div class="timer"><div id="tbar" style="width:100%"></div></div>
    <div class="prompt">${prompt}</div>
    <div class="opts" id="opts">${optHtml}</div>
    <div id="after"></div>`;

  const sayBtn = document.getElementById("say");
  if(sayBtn) sayBtn.onclick = ()=>speak(hz);
  if(Q.type==="listen") speak(hz);
  const hintBtn = document.getElementById("hint");
  if(hintBtn) hintBtn.onclick = ()=>{
    if(qState.answered||qState.hint) return;
    qState.hint = true; hintBtn.disabled = true;
    if(Q.type==="meaning") document.getElementById("py").textContent = py;
    else $app.querySelectorAll(".hidepy").forEach(s=>s.style.display="block");
  };
  $app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  startTimer();
}

function startTimer(){
  const bar = document.getElementById("tbar");
  timer = setInterval(()=>{
    const left = Math.max(0, 1 - (performance.now()-qState.start)/qState.limit);
    bar.style.width = (left*100)+"%";
    bar.className = left<.25?"danger":left<.5?"warn":"";
    if(left<=0) answer(-1);
  }, 100);
}
function stopTimer(){ if(timer){ clearInterval(timer); timer=null; } }

function recordWord(p, hz, ok, R){
  const rec = p.words[hz] || (p.words[hz] = {ok:0, bad:0, run:0, m:false});
  if(ok){
    rec.ok++; rec.run++;
    if(!rec.m && rec.run>=MASTER_RUN){ rec.m = true; R.newMastered.push(hz); if(rec.bad>0) R.comeback = true; }
  }else{
    rec.bad++; rec.run = 0; rec.m = false;
  }
}

function answer(i){
  if(!qState || qState.answered) return;
  qState.answered = true; stopTimer();
  const pi = duel.order[duel.turn], R = duel.res[pi], P = store.players[pi];
  const Q = duel.qs[pi][duel.q], [hz,py,en] = Q.w;
  const correctIdx = Q.opts.findIndex(o=>o[0]===hz);
  const ok = i===correctIdx;
  const secs = (performance.now()-qState.start)/1000;
  const left = Math.max(0, 1 - secs*1000/qState.limit);
  let pts = 0;
  if(ok){ pts = Math.max(20, 100 + Math.round(50*left) - (qState.hint?30:0)); R.score += pts; R.correct++; R.times.push(secs); }
  else R.missed.push(Q.w);
  if(Q.type==="listen"){ R.listenN++; if(ok) R.listenOK++; }
  R.marks[duel.q] = ok;
  recordWord(profile(P.name, P.avatar), hz, ok, R);

  $app.querySelectorAll(".opt").forEach((b,k)=>{
    b.disabled = true;
    if(k===correctIdx) b.classList.add("correct"); else if(k===i) b.classList.add("wrong"); else b.classList.add("dim");
  });
  $app.querySelectorAll(".hidepy").forEach(s=>s.style.display="block");
  document.getElementById("sc").textContent = R.score+" pts";
  $app.querySelectorAll(".dots i")[duel.q].className = ok?"ok":"no";
  if(!ok) document.getElementById("opts").classList.add("shake");

  const last = duel.q===QN-1;
  const justMastered = R.newMastered[R.newMastered.length-1]===hz;
  document.getElementById("after").innerHTML = `
    <div class="reveal ${ok?"good":"bad"} pop">
      <span class="rhz">${hz}</span>
      <span class="rtxt"><b>${py}</b><small>${esc(en)}${justMastered?" · ⭐ mastered!":""}</small></span>
      <button class="say" id="say2">🔊</button>
      <span class="pts">${ok?"+"+pts:(i===-1?"⏰":"✗")}</span>
    </div>
    <button class="btn ${pi===0?"":"blue"} next" id="nx">${last?(duel.turn===0?"Done — pass it on →":"See who won! 🏆"):"Next →"}</button>`;
  document.getElementById("say2").onclick=()=>speak(hz);
  if(!ok) speak(hz);
  document.getElementById("nx").onclick = ()=>{
    if(!last){ duel.q++; question(); }
    else if(duel.turn===0){ duel.turn=1; handoff(); }
    else results();
  };
}

function awardBadges(){
  const P = store.players, R = duel.res, earned = [[],[]];
  const w = R[0].score===R[1].score ? -1 : (R[0].score>R[1].score?0:1);
  const st = store.streak, d = today();
  [0,1].forEach(i=>{
    const p = profile(P[i].name), r = R[i], other = P[1-i];
    const give = id => { if(!p.badges[id]){ p.badges[id] = d; earned[i].push(id); } };
    give("first");
    if(r.correct===QN) give("perfect");
    if(r.correct>=6 && r.times.reduce((s,t)=>s+t,0)/r.times.length < 4) give("speed");
    if(r.listenN>=2 && r.listenOK===r.listenN) give("tone");
    if(w===i && LEVELS[P[i].level].kid && !LEVELS[other.level].kid) give("slayer");
    if(r.comeback) give("comeback");
    const m = masteredTotal(p);
    if(m>=10) give("w10"); if(m>=25) give("w25");
    if(p.duels>=10) give("d10");
    if(st>=3) give("s3"); if(st>=7) give("s7"); if(st>=30) give("s30");
  });
  return earned;
}
function levelNudge(p, levelKey){
  const nxt = LEVELS[levelKey].next; if(!nxt) return null;
  const h = p.history.filter(x=>x.lvl===levelKey).slice(-3);
  if(h.length===3 && h.every(x=>x.acc>=0.85)) return nxt;
  return null;
}

function results(){
  stopTimer();
  const P = store.players, R = duel.res;
  const w = R[0].score===R[1].score ? -1 : (R[0].score>R[1].score?0:1);
  const t = today();
  if(store.last!==t){ store.streak = (store.last===yesterday()) ? (store.streak||0)+1 : 1; store.last = t; }
  [0,1].forEach(i=>{
    const p = profile(P[i].name, P[i].avatar);
    p.duels++; if(i===w) p.wins++;
    p.best = Math.max(p.best||0, R[i].score);
    p.history.push({d:t, lvl:P[i].level, acc:R[i].correct/QN, score:R[i].score, won:i===w});
    if(p.history.length>200) p.history = p.history.slice(-200);
  });
  const earned = awardBadges();
  store.nextFirst = duel.first===0 ? 1 : 0;
  save();

  const missed = [];
  [0,1].forEach(i=>R[i].missed.forEach(m=>missed.push({m, av:P[i].avatar})));
  const nb = [];
  [0,1].forEach(i=>earned[i].forEach(id=>nb.push({i, b:BADGES.find(x=>x.id===id)})));
  const nudges = [0,1].map(i=>({i, nxt:levelNudge(profile(P[i].name), P[i].level)})).filter(x=>x.nxt);

  $app.innerHTML = `
    <div class="winner">
      <div class="crown pop">${w===-1?"🤝":"👑"}</div>
      ${w===-1?`<div class="wav">${P[0].avatar}${P[1].avatar}</div><h2>It's a draw!</h2>`:
        `<div class="wav pop">${P[w].avatar}</div><h2>${esc(P[w].name)} wins!</h2>`}
      <p>🔥 Family streak: ${store.streak} day${store.streak===1?"":"s"}</p>
    </div>
    <div class="scores">
      ${[0,1].map(i=>`<div class="sc p${i}"><div class="n">${P[i].avatar} ${esc(P[i].name)}</div><div class="s">${R[i].score}</div><small>${R[i].correct}/${QN} correct</small><div class="lvl">${lvlName(P[i].level)}</div>${R[i].newMastered.length?`<div class="gain">⭐ +${R[i].newMastered.length} mastered</div>`:""}</div>`).join("")}
    </div>
    ${nb.length?`<div class="card newbadges pop"><div class="label">New badge${nb.length===1?"":"s"}!</div>
      ${nb.map(x=>`<div class="nb-row"><span class="bi">${x.b.i}</span><span><b>${esc(P[x.i].name)}: ${x.b.n}</b><span>${x.b.d}</span></span></div>`).join("")}</div>`:""}
    ${nudges.map(x=>`<div class="card nudge"><span class="ic">🚀</span><p><b>${esc(P[x.i].name)}</b> scored 85%+ three duels in a row. Ready to move up to <b>${lvlName(x.nxt)}</b>? Change it in setup.</p></div>`).join("")}
    <div class="card">
      <div class="label">Words to review together</div>
      ${missed.length? missed.map((x,k)=>`<div class="review-row"><span class="whose">${x.av}</span><span class="rhz">${x.m[0]}</span><span class="rtxt">${x.m[1]}<small>${esc(x.m[2])}</small></span><button class="say" data-k="${k}">🔊</button></div>`).join("")
        : `<p class="empty">Perfect round — nothing missed! 🎉</p>`}
    </div>
    <button class="btn" id="re">⚔️ Rematch</button>
    <button class="btn ghost" id="pr0">${P[0].avatar} ${esc(P[0].name)}'s progress</button>
    <button class="btn ghost" id="pr1">${P[1].avatar} ${esc(P[1].name)}'s progress</button>
    <button class="btn ghost" id="hm">Home</button>`;
  $app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>speak(missed[+b.dataset.k].m[0]));
  document.getElementById("re").onclick = ()=>{ newDuel(store.nextFirst); handoff(); };
  document.getElementById("pr0").onclick = ()=>profileScreen(P[0].name, home);
  document.getElementById("pr1").onclick = ()=>profileScreen(P[1].name, home);
  document.getElementById("hm").onclick = home;
}

function accuracyChart(hist){
  const h = hist.slice(-12), n = h.length;
  if(!n) return `<p class="empty">Play a duel to start the chart.</p>`;
  const W=320, H=140, L=40, B=22, T=14, bw=(W-L-6)/12, off=12-n;
  const y = v => T + (H-T-B)*(1-v);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Accuracy in the last ${n} duels">`;
  [0,0.5,1].forEach(v=>{ s += `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#EDE3D3" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" font-size="10" fill="#7A7090" text-anchor="end">${v*100}%</text>`; });
  h.forEach((x,i)=>{
    const cx = L + 3 + (i+off)*bw, top = y(x.acc), col = LEVELS[x.lvl] && LEVELS[x.lvl].kid ? "#21A072" : "#3A63E0";
    s += `<rect x="${cx+3}" y="${top}" width="${bw-6}" height="${Math.max(2,(H-B)-top)}" rx="4" fill="${x.won?col:col+"99"}"/>`;
    if(x.won) s += `<text x="${cx+bw/2}" y="${top-3}" font-size="10" text-anchor="middle">👑</text>`;
  });
  s += `<text x="${L}" y="${H-6}" font-size="10" fill="#7A7090">older</text><text x="${W}" y="${H-6}" font-size="10" fill="#7A7090" text-anchor="end">latest</text></svg>`;
  const first = h.slice(0,Math.ceil(n/2)), last = h.slice(Math.floor(n/2));
  const avg = a => a.reduce((t,x)=>t+x.acc,0)/a.length;
  const delta = n>=4 ? Math.round((avg(last)-avg(first))*100) : null;
  return s + `<p class="note">Each bar is one duel's accuracy (👑 = won). ${delta===null?"":delta>0?`Up ${delta} points recently — improving! 📈`:delta<0?`Down ${-delta} points recently — keep practising.`:"Holding steady."}</p>`;
}

function profileScreen(name, back){
  stopTimer();
  const p = store.profiles[name]; if(!p){ home(); return; }
  const last = p.history[p.history.length-1];
  const curLvl = last ? last.lvl : null;
  const nudge = curLvl ? levelNudge(p, curLvl) : null;
  const acc = p.history.length ? Math.round(100*p.history.slice(-10).reduce((t,x)=>t+x.acc,0)/Math.min(10,p.history.length)) : 0;
  const played = Object.keys(LEVELS).filter(k=>p.history.some(x=>x.lvl===k) || LEVELS[k].words.some(w=>p.words[w[0]]));
  const weak = Object.entries(p.words).filter(([,r])=>!r.m && r.bad>0).sort((a,b)=>b[1].bad-a[1].bad).slice(0,6);
  $app.innerHTML = `
    <div class="topbar"><button class="back" id="bk">← Back</button><span></span></div>
    <div class="phead"><span class="pav">${p.avatar}</span><div><h2>${esc(name)}</h2><p>${curLvl?lvlName(curLvl):"No duels yet"}</p></div></div>
    <div class="stats">
      <div class="stat"><b>${p.duels}</b><span>Duels</span></div>
      <div class="stat"><b>${p.wins}</b><span>Wins</span></div>
      <div class="stat"><b>${masteredTotal(p)}</b><span>Mastered</span></div>
      <div class="stat"><b>${acc}%</b><span>Accuracy</span></div>
    </div>
    ${nudge?`<div class="card nudge"><span class="ic">🚀</span><p>85%+ three duels in a row. Ready for <b>${lvlName(nudge)}</b>?</p></div>`:""}
    <div class="card chart"><div class="label">Accuracy, last ${Math.min(12,p.history.length)} duels</div>${accuracyChart(p.history)}</div>
    <div class="card"><div class="label">Badges · ${Object.keys(p.badges).length} of ${BADGES.length}</div>
      <div class="badges">${BADGES.map(b=>`<div class="badge ${p.badges[b.id]?"":"off"}"><div class="bi">${b.i}</div><b>${b.n}</b><span>${b.d}</span></div>`).join("")}</div>
    </div>
    <div class="card"><div class="label">Words mastered (right ${MASTER_RUN}× in a row)</div>
      ${played.length?played.map(k=>{ const m=masteredIn(p,k), t=LEVELS[k].words.length;
        return `<div class="pack"><div class="top">${lvlName(k)}<span>${m} / ${t}</span></div><div class="bar"><div style="width:${100*m/t}%"></div></div></div>`; }).join("")
        :`<p class="empty">Nothing yet — every duel builds this up.</p>`}
    </div>
    ${weak.length?`<div class="card"><div class="label">Tricky words · practise these</div>
      ${weak.map(([hz,r],k)=>{ const w=WORD[hz]?WORD[hz].w:[hz,"",""]; return `<div class="review-row"><span class="rhz">${w[0]}</span><span class="rtxt">${w[1]}<small>${esc(w[2])} · missed ${r.bad}×</small></span><button class="say" data-hz="${esc(hz)}">🔊</button></div>`; }).join("")}</div>`:""}
    <button class="btn ghost" id="bk2">Back</button>`;
  $app.querySelectorAll("[data-hz]").forEach(b=>b.onclick=()=>speak(b.dataset.hz));
  document.getElementById("bk").onclick = back;
  document.getElementById("bk2").onclick = back;
  window.scrollTo(0,0);
}

/* ---------------- Modals ---------------- */
function modal(html){
  const m = document.createElement("div"); m.className="modal";
  m.innerHTML = `<div class="box">${html}</div>`;
  m.onclick = e=>{ if(e.target===m) m.remove(); };
  document.body.appendChild(m); return m;
}
function howModal(){
  const m = modal(`<h3>How a duel works</h3>
    <ul class="how">
      <li>Pick two players and set each one's level. Kids and grown-ups get different words.</li>
      <li>Each player answers ${QN} timed questions: meanings, characters and listening.</li>
      <li>Points = correct answer + speed bonus. A pinyin hint costs 30.</li>
      <li>Words you miss come back more often (🔁). Get one right ${MASTER_RUN} times in a row to master it ⭐.</li>
      <li>Earn badges, keep the family streak going 🔥 and watch your progress chart climb.</li>
    </ul>
    <button class="btn" id="ok">Got it</button>`);
  m.querySelector("#ok").onclick = ()=>m.remove();
}
function backupModal(){
  let code = "";
  try{ code = btoa(unescape(encodeURIComponent(JSON.stringify(store)))); }catch(e){}
  const m = modal(`<h3>Back up / restore</h3>
    <p>Progress is saved on this device. Copy this code and keep it somewhere safe (e.g. Notes or email to yourself).</p>
    <textarea id="code" readonly>${code}</textarea>
    <div class="msg" id="msg"></div>
    <button class="btn small jade" id="copy">Copy backup code</button>
    <p style="margin:16px 0 8px">To restore, paste a backup code here:</p>
    <textarea id="paste" placeholder="Paste code…"></textarea>
    <button class="btn small ghost" id="restore">Restore</button>
    <button class="btn small ghost" id="close">Close</button>`);
  const msg = m.querySelector("#msg");
  m.querySelector("#copy").onclick = async ()=>{
    try{ await navigator.clipboard.writeText(code); msg.textContent="Copied ✓"; msg.style.color="var(--jade)"; }
    catch(e){ const t=m.querySelector("#code"); t.focus(); t.select(); msg.textContent="Selected — tap Copy from the menu."; msg.style.color="var(--muted)"; }
  };
  let armed = false;
  m.querySelector("#restore").onclick = ()=>{
    const raw = m.querySelector("#paste").value.trim();
    let data = null;
    try{ data = JSON.parse(decodeURIComponent(escape(atob(raw)))); }catch(e){}
    if(!data || !data.profiles){ msg.textContent="That code doesn't look right."; msg.style.color="var(--wrong)"; return; }
    if(!armed){ armed = true; msg.textContent="This replaces all progress on this device. Tap Restore again to confirm."; msg.style.color="var(--wrong)"; return; }
    store = data; save(); m.remove(); home();
  };
  m.querySelector("#close").onclick = ()=>m.remove();
}
function gateModal(){
  const a = 6+Math.floor(Math.random()*4), b = 6+Math.floor(Math.random()*4), ans=a*b;
  const opts = shuffle([ans, ans+a, ans-b, ans+7]);
  const m = modal(`<h3>Grown-ups only 🔒</h3>
    <p>This is the parental gate Apple requires before any purchase. Hold the button for 2 seconds.</p>
    <button class="btn hold" id="hold"><span class="fill" id="fill"></span><span>Press &amp; hold</span></button>
    <div id="step2"></div>`);
  const hold = m.querySelector("#hold"), fill = m.querySelector("#fill");
  let t0=null, raf=null, done=false;
  const tick=()=>{ const p=Math.min(1,(performance.now()-t0)/2000); fill.style.width=(p*100)+"%"; if(p>=1){done=true;step2();} else raf=requestAnimationFrame(tick); };
  const down=e=>{ e.preventDefault(); if(done) return; t0=performance.now(); raf=requestAnimationFrame(tick); };
  const up=()=>{ if(done) return; cancelAnimationFrame(raf); fill.style.width="0"; };
  hold.addEventListener("pointerdown",down); hold.addEventListener("pointerup",up); hold.addEventListener("pointerleave",up);
  function step2(){
    hold.style.display="none";
    m.querySelector("#step2").innerHTML = `<p>Now answer: what is ${a} × ${b}?</p>
      <div class="gate-opts">${opts.map(o=>`<button data-v="${o}">${o}</button>`).join("")}</div>`;
    m.querySelectorAll("[data-v]").forEach(btn=>btn.onclick=()=>{
      if(+btn.dataset.v===ans){
        m.querySelector(".box").innerHTML = `<h3>Family Pass</h3>
          <p>In the real app, parents would buy the Family Pass here: all word packs, up to 6 players and team mode.<br><br>Prices being tested: <b>S$7.98/month</b> or <b>S$59.98/year</b> with a 7-day free trial.</p>
          <button class="btn jade" id="cl">Close</button>`;
        m.querySelector("#cl").onclick=()=>m.remove();
      }else{ m.remove(); }
    });
  }
}

/* ---------------- Offline support (home-screen app) ---------------- */
try{
  if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost") && true)
    navigator.serviceWorker.register("sw.js").catch(()=>{});
}catch(e){}

home();
</script>
