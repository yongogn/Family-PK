</style></head><body><div class="preview-bar">LEARNING CONCEPT PREVIEW · Sample profile and progress · Nothing is saved to your game <a href="review.html">Read the code review ↗</a></div><main id="app"></main><div id="layer"></div><script>
'use strict';
const state={stars:12,rewardStars:12,threshold:15,round:0,earned:[false,false,false],retry:0,locked:false,question:null,complete:false,passUsed:false,showWorked:false,buildStep:0,view:'hub'};
const app=document.querySelector('#app'),layer=document.querySelector('#layer');
function escapeText(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function header(){return `<header><div class="brand"><i aria-hidden="true">✦</i><span>Quest <b>PK</b></span></div><div class="profile"><span class="profile-icon">E</span><span><strong>Explorer</strong>Year 3 · sample learner</span></div><div class="pill">★ ${state.stars} learning stars</div></header>`}
function rewardPanel(){const remaining=Math.max(0,state.threshold-state.rewardStars);return `<aside class="card reward-card"><div><div class="eyebrow">A little extra, earned</div><div class="reward-star" aria-hidden="true">✦</div><h3>${remaining?'Your next arcade pass':state.passUsed?'Ready for another discovery?':'You earned your arcade pass!'}</h3><p>${remaining?'Keep exploring. '+remaining+' newly earned stars unlock your next arcade round.':state.passUsed?'Your sample pass has been used. Your reward meter has restarted. Your lifetime learning stars stay with you.':'Three successful checks completed. Your reward is ready.'}</p></div><div class="meter" aria-label="${state.rewardStars} of ${state.threshold} reward stars"><i style="width:${Math.min(100,state.rewardStars/state.threshold*100)}%"></i></div><div class="small muted">${state.rewardStars} / ${state.threshold} reward stars</div><button class="btn ${remaining?'ghost':'gold'}" ${remaining||state.passUsed?'disabled':''} onclick="showReward()">${remaining?'Arcade reward locked':state.passUsed?'Sample pass used':'Claim earned pass →'}</button></aside>`}
function hub(){stopSpeech();state.view='hub';app.innerHTML=header()+`<section class="hero"><div class="hero-copy"><div class="eyebrow">Your world grows with you</div><h1>A little discovery.<br><span>A bigger you.</span></h1><p>Build an idea. Try it for yourself. Turn what you learn into your next adventure.</p><button class="btn gold" onclick="lesson()">${state.complete?'Revisit what you learned':'Explore your next quest'} <span aria-hidden="true">→</span></button></div><div class="hero-tag">Number Kingdom · Word Woods · Science Lab</div></section><div class="section-head"><h2>Your next discovery</h2><p>One clear goal. A little practice. Progress you can feel.</p></div><div class="layout"><section class="card quest-card"><div class="quest-icon" aria-hidden="true"><span>+10</span></div><div class="quest-content"><div class="eyebrow">Number Kingdom · Place value</div><h3>Cross the next hundred</h3><p class="small muted">Discover how tens regroup when you add across a hundred. Understand the idea, then put it to work.</p><div class="meta"><span>Worked example</span><span>3 learning checks</span><span>Up to 3 stars</span></div><button class="btn" onclick="lesson()">${state.complete?'Review this quest':state.round?'Continue your quest':'Start learning'} →</button></div></section>${rewardPanel()}</div><div class="subject-row"><div class="subject-tile"><span class="subject-glyph">Aa</span><strong>Word Woods</strong><p>Future quest idea: choose words that bring a story to life.</p></div><div class="subject-tile"><span class="subject-glyph">◈</span><strong>Science Lab</strong><p>Future quest idea: predict, test, and explain what changes.</p></div><div class="subject-tile"><span class="subject-glyph">↻</span><strong>Remember & grow</strong><p>Future feature: revisit an idea before it fades, with a fresh example.</p></div></div><p class="concept-note">This interactive preview demonstrates one maths quest. The other journeys above are design concepts. It starts with 12 sample stars so you can see the full learning-to-reward flow. This demo illustrates a fresh star target for each arcade round. The real app and its reward rules are unchanged.</p><footer class="foot"><span>Learning leads. Arcade play is an earned extra.<br>No accounts, real progress, or game credits are changed by this preview.</span><a href="review.html">See the findings and recommended next steps →</a></footer>`;window.scrollTo(0,0)}
function flow(active){return `<div class="lesson-flow">${['Discover','Try it','Show you understand','Earn your reward'].map((s,i)=>`<span class="${i===active?'on':''}">${s}</span>`).join('')}</div>`}
function lessonTop(){return header()+`<div class="lesson-shell"><div class="lesson-top"><button class="back" onclick="hub()">‹ Your world</button><h1>Cross the next hundred</h1><span class="eyebrow">Place value</span></div>`}
function lesson(){stopSpeech();state.view='learn';const h=state.buildStep===2?2:1,t=state.buildStep===0?8:state.buildStep===1?16:6;app.innerHTML=lessonTop()+flow(0)+`<section class="card lesson-card"><span class="status">The idea · Year 3 example</span><h2>Tens can build a hundred.</h2><p>When you have 10 tens, you can regroup them into 1 hundred.<br>The ones stay the same when you add a multiple of ten.</p><div class="lesson-equation">185 + 80 = <em>${state.buildStep===2?'265':'…'}</em></div><div class="regroup-controls">${['Start: 185','Add 8 tens','Regroup 10 tens'].map((label,i)=>`<button class="${state.buildStep===i?'on':''}" aria-pressed="${state.buildStep===i}" data-step="${i}" onclick="setBuildStep(${i})">${i+1} · ${label}</button>`).join('')}</div><p class="build-description" aria-live="polite">${state.buildStep===0?'Start with 1 hundred, 8 tens and 5 ones.':state.buildStep===1?'Add 8 more tens. You now have 16 tens — enough to make another hundred.':'Trade 10 tens for 1 hundred. Now there are 2 hundreds, 6 tens and 5 ones.'}</p><div class="place-grid"><div class="place-box"><div class="blocks">${'<i class="block"></i>'.repeat(h)}</div><strong>${h}</strong><small>HUNDREDS</small></div><div class="place-box"><div class="blocks tens-group">${'<i class="block tens"></i>'.repeat(t)}</div><strong>${t}</strong><small>TENS</small></div><div class="place-box"><div class="blocks">${'<i class="block ones"></i>'.repeat(5)}</div><strong>5</strong><small>ONES</small></div></div><button class="hint" onclick="worked()">${state.showWorked?'Hide':'Show'} the regrouping steps</button><div id="worked">${state.showWorked?workedExample(185,80):''}</div><div class="lesson-actions"><button class="read" onclick="speak('185 plus 80. There are 18 tens and 5 ones in 185. Add 8 tens. 26 tens and 5 ones can regroup as 2 hundreds, 6 tens and 5 ones. 265.')">Read the explanation</button><button class="btn" onclick="${state.complete?'summary()':'beginPractice()'}">${state.complete?'See your completed quest':'Let me try'} →</button></div><p class="no-pressure">No race, no countdown. Take the time you need to understand.</p></section></div>`;window.scrollTo(0,0)}
function setBuildStep(n){const y=window.scrollY;state.buildStep=n;lesson();window.scrollTo(0,y);document.querySelector('[data-step="'+n+'"]')?.focus({preventScroll:true})}
function worked(){const y=window.scrollY;state.showWorked=!state.showWorked;lesson();window.scrollTo(0,y)}
function workedExample(a,b){const h=Math.floor(a/100),t=Math.floor(a%100/10),o=a%10,extra=b/10,totalTens=t+extra,ans=a+b;return `<div class="worked"><b>Build it in place values</b><ol><li>${a} is ${h} hundred${h===1?'':'s'}, ${t} tens and ${o} ones.</li><li>${b} adds ${extra} more tens. Now we have ${totalTens} tens.</li><li>Regroup 10 tens as 1 hundred: <b>${Math.floor(ans/100)} hundreds, ${Math.floor(ans%100/10)} tens, ${o} ones = ${ans}.</b></li></ol>The ones stay at ${o}. Both the hundreds and tens can change.</div>`}
function makeQuestion(){const presets=[[146,70],[278,50],[367,80]];let [a,b]=presets[state.round];if(state.retry){a=(state.round+1)*100+30+(state.retry*13)%60;b=10*Math.ceil((101-a%100)/10)}const ans=a+b;return {a,b,ans,opts:shuffle([ans,ans-100,ans+10,ans+100])}}
function beginPractice(){if(state.complete)return summary();stopSpeech();state.view='practice';if(!state.question)state.question=makeQuestion();state.locked=false;practice()}
function practice(){const q=state.question,final=state.round===2;state.view='practice';app.innerHTML=lessonTop()+flow(final?2:1)+`<section class="card lesson-card"><span class="status">${final?'Independent check':'Practice check'} ${state.round+1} of 3</span><h2>${final?'You have the idea. Show it.':'Let’s put those tens to work.'}</h2><p>${final?'A fresh example, without a hint. Take your time.':'Add the tens. Watch what happens to the hundreds.'}</p><div class="lesson-equation">${q.a} + ${q.b} = <em>?</em></div><button class="read" onclick="speak('${q.a} plus ${q.b}. What is the answer?')">Read question</button><div class="answer-grid">${q.opts.map((v,i)=>`<button class="answer" data-answer="${v}" onclick="choose(${i})">${v}</button>`).join('')}</div>${final?'':'<button class="hint" onclick="hint()">I’d like a clue</button>'}<div id="hint"></div><div id="feedback" aria-live="polite"></div><p class="no-pressure">A mistake is useful information. We’ll work through it, then try a different example.</p></section></div>`;window.scrollTo(0,0)}
function hint(){if(state.locked)return;document.querySelector('#hint').innerHTML=workedExample(state.question.a,state.question.b)}
function choose(i){if(state.locked)return;state.locked=true;const q=state.question,ok=q.opts[i]===q.ans;document.querySelectorAll('.answer').forEach(el=>{el.disabled=true;if(+el.dataset.answer===q.opts[i])el.classList.add(ok?'right':'wrong')});if(ok){if(!state.earned[state.round]){state.earned[state.round]=true;state.stars++;state.rewardStars++;document.querySelector('.pill').textContent='★ '+state.stars+' learning stars'}document.querySelector('#feedback').innerHTML=`<div class="feedback"><h3>You’ve got it. +1 learning star</h3>${q.a} + ${q.b} = <b>${q.ans}</b>. You regrouped the tens into hundreds.${state.round===2?' You completed the independent check.':''}<br><button class="btn" onclick="nextCheck()">${state.round===2?'Finish your quest':'Try the next check'} →</button></div>`}else{document.querySelector('#feedback').innerHTML=`<div class="feedback wrong"><h3>Let’s build it together.</h3>The answer is <b>${q.ans}</b>. Here is how the tens regroup.${workedExample(q.a,q.b)}No star is lost. We’ll use a fresh example before you earn this check’s star.<br><button class="btn" onclick="freshExample()">Try a fresh example →</button></div>`}document.querySelector('#feedback').scrollIntoView({behavior:'smooth',block:'nearest'})}
function freshExample(){stopSpeech();state.retry++;state.question=makeQuestion();state.locked=false;practice()}
function nextCheck(){stopSpeech();state.round++;state.retry=0;state.question=null;if(state.round===3){state.complete=true;summary()}else beginPractice()}
function summary(){state.view='summary';app.innerHTML=lessonTop()+flow(3)+`<section class="card lesson-card"><div class="celebration" aria-hidden="true">✦</div><span class="status">Quest complete · 3 learning checks</span><h2>You made a bigger idea click.</h2><p>You practised regrouping tens across a hundred,<br>then completed a fresh example independently.</p><div class="lesson-equation" style="font-size:40px;color:#c89837">+3 learning stars</div><div class="worked"><b>Keep this idea</b><br>10 tens can regroup as 1 hundred. Adding tens keeps the ones digit the same, while the hundreds and tens can both change.</div><div class="lesson-actions"><button class="btn gold" ${state.passUsed?'disabled':''} onclick="showReward()">${state.passUsed?'Sample pass used':'See your earned reward →'}</button><button class="btn ghost" onclick="hub()">Back to your learning world</button></div><p class="no-pressure">This completed quest cannot award its demo stars a second time.<br>A full version would return later with spaced practice and a new skill challenge.</p></section></div>`;window.scrollTo(0,0)}
function showReward(){if(state.rewardStars<state.threshold||state.passUsed)return;layer.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="reward-title"><div class="card"><div class="celebration" aria-hidden="true">✦</div><div class="eyebrow">Learning earned this</div><h2 id="reward-title">One arcade pass, unlocked.</h2><p>Your 12 sample reward stars plus 3 newly earned learning stars reached the 15-star goal. One round uses these reward stars, while your lifetime learning stars stay at 15.</p><p>In the full experience, this would open one bounded arcade round, then bring you back to learning.</p><button class="btn gold" onclick="claimPass()">Use one sample pass</button><button class="back" onclick="closeReward()">Return to learning</button><p class="small">This is a preview. No real arcade credits are added or spent.</p></div></div>`;layer.querySelector('.btn').focus()}
function closeReward(){layer.innerHTML=''}
function claimPass(){state.rewardStars-=state.threshold;state.passUsed=true;closeReward();hub()}
function speak(text){if(!('speechSynthesis'in window))return;stopSpeech();const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=.9;speechSynthesis.speak(u)}
function stopSpeech(){try{speechSynthesis.cancel()}catch(e){}}
window.addEventListener('pagehide',stopSpeech);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&layer.innerHTML){closeReward();return}if(state.view==='practice'&&!state.locked&&/^[1-4]$/.test(e.key))choose(+e.key-1)});
hub();
</script></body></html>
