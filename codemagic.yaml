# Kinquest iPad app — Codemagic build recipe.
# Press "Start new build" in Codemagic → it builds the iPad app from quest-pk/ and uploads it to TestFlight.
workflows:
  kinquest-ios:
    name: Kinquest iPad → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: Kinquest ASC            # the App Store Connect API key you add in Codemagic (same name)
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.sunnyloop.kinquest
      vars:
        BUNDLE_ID: com.sunnyloop.kinquest
        APP_STORE_APPLE_ID: 0000000000           # ← replace with the app's Apple ID (App Store Connect → App Information)
        APP_VERSION: 1.0.0                       # the version shown on the App Store
      node: 22
      xcode: latest
    scripts:
      - name: Install Capacitor
        script: |
          cd appstore
          npm install
      - name: Create the iPad project from quest-pk
        script: |
          cd appstore
          rm -rf ios
          npx cap add ios
          npx cap sync ios
      - name: App icon and launch screen
        script: |
          cd appstore
          mkdir -p resources
          cp ../quest-pk/icon-1024.png resources/icon.png
          npx @capacitor/assets generate --ios --assetPath resources --splashBackgroundColor "#ffc94a" --splashBackgroundColorDark "#ff7a59"
      - name: iPad only, permissions, version and build number
        script: |
          cd appstore/ios/App
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2";/TARGETED_DEVICE_FAMILY = 2;/g' App.xcodeproj/project.pbxproj
          sed -i '' "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = $APP_VERSION;/g" App.xcodeproj/project.pbxproj
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          NEXT=$((LATEST + 1))
          sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = $NEXT;/g" App.xcodeproj/project.pbxproj
          PL=App/Info.plist
          set_plist () { /usr/libexec/PlistBuddy -c "Delete :$1" "$PL" 2>/dev/null || true; /usr/libexec/PlistBuddy -c "Add :$1 $2 $3" "$PL"; }
          set_plist CFBundleDisplayName string "Kinquest"
          set_plist NSMicrophoneUsageDescription string "Kinquest listens when you tap the microphone so it can check how you say a word. Your voice is never saved or shared."
          set_plist NSSpeechRecognitionUsageDescription string "Kinquest uses speech recognition on this iPad to check spoken words in spelling and Chinese practice."
          set_plist NSLocalNetworkUsageDescription string "Kinquest connects to another iPad nearby when you play a two-iPad game."
          set_plist ITSAppUsesNonExemptEncryption bool false
          echo "Version $APP_VERSION build $NEXT"
      - name: Use the signing profiles
        script: xcode-project use-profiles
      - name: Build the iPad app
        script: |
          xcode-project build-ipa --project "appstore/ios/App/App.xcodeproj" --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
